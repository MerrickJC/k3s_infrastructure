apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: unified-automation
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  # A matrix generator cross-joins the per-app git-files generator with a
  # single-element list generator. This makes repoURL/revision available as
  # ordinary '{{ .repoURL }}'/'{{ .revision }}' parameters in templatePatch,
  # so the repository URL and branch exist as a literal in exactly one place
  # below instead of being repeated inside every conditional source block.
  generators:
    - matrix:
        generators:
          - git:
              repoURL: 'https://github.com/MerrickJC/k3s_infrastructure.git'
              revision: main
              files:
                - path: "kubernetes/apps/*/config.yaml"
                ###########################################################################
                ## BELOW IS A LIST OF DIRECTORIES BEING EXCLUDED FROM CREATION BY ARGOCD ##
                ###########################################################################
                - path: "kubernetes/apps/example/config.yaml"
                  exclude: true
          - list:
              elements:
                - repoURL: 'https://github.com/MerrickJC/k3s_infrastructure.git'
                  revision: main
  # Base template must have valid YAML (no Go conditionals here).
  # templatePatch below handles conditional source assembly.
  template:
    metadata:
      name: '{{ .appName }}'
    spec:
      project: default
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
      sources: []
  # templatePatch is rendered as a Go template by ArgoCD and merged as a
  # strategic merge patch on top of the base template above.
  # This is the correct way to conditionally include sources without
  # producing invalid YAML that breaks Kustomize parsing.
  templatePatch: |
    {{- if or (hasKey . "labels") (hasKey . "annotations") }}
    metadata:
      {{- if hasKey . "labels" }}
      labels: {{ toYaml .labels | nindent 8 }}
      {{- end }}
      {{- if hasKey . "annotations" }}
      annotations: {{ toYaml .annotations | nindent 8 }}
      {{- end }}
    {{- end }}
    spec:
      sources:
        {{- if (default false .hasHelm) }}
        - repoURL: '{{ .helm.repoURL }}'
          chart: '{{ .helm.chart }}'
          targetRevision: '{{ .helm.targetRevision }}'
          helm:
            valueFiles:
              - '$values/kubernetes/apps/{{ .appName }}/values.yaml'
            ignoreMissingValueFiles: true
        - repoURL: '{{ .repoURL }}'
          targetRevision: '{{ .revision }}'
          ref: values
        {{- end }}
        {{- if hasKey . "helmGit" }}
        - repoURL: '{{ .helmGit.repoURL }}'
          path: '{{ .helmGit.path }}'
          targetRevision: '{{ .helmGit.targetRevision }}'
          helm:
            valueFiles:
              - '$values/kubernetes/apps/{{ .appName }}/values.yaml'
            ignoreMissingValueFiles: true
        - repoURL: '{{ .repoURL }}'
          targetRevision: '{{ .revision }}'
          ref: values
        {{- end }}
        {{- if (default false .hasManifests) }}
        - repoURL: '{{ .repoURL }}'
          targetRevision: '{{ .revision }}'
          path: 'kubernetes/apps/{{ .appName }}'
          directory:
            recurse: true
        {{- end }}
      {{- if hasKey . "ignoreDifferences" }}
      ignoreDifferences: {{ toYaml .ignoreDifferences | nindent 8 }}
      {{- end }}
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          {{- if hasKey . "syncOptions" }}
          {{- range .syncOptions }}
          - '{{ . }}'
          {{- end }}
          {{- end }}
        {{- if hasKey . "preventDeletion" }}
        {{- if .preventDeletion }}
        preserveResourcesOnDeletion: true
        {{- end }}
        {{- end }}
        {{- if hasKey . "retry" }}
        retry: {{ toYaml .retry | nindent 10 }}
        {{- end }}
