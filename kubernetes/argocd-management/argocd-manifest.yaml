apiVersion: v1
kind: Namespace
metadata:
  name: argocd
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  # Protect Argo CD from accidental deletion
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/MerrickJC/k3s_infrastructure.git'
    targetRevision: main
    path: 'kubernetes/argocd-management' # Path to the folder with kustomization.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # REQUIRED: Server-Side Apply is mandatory for Argo CD manifests
      - ServerSideApply=true
---
# Explicitly declare the default AppProject (ArgoCD creates it at runtime,
# so it must be listed here for kustomize to manage it)
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: default
  namespace: argocd
spec:
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  destinations:
    - namespace: '*'
      server: '*'
  sourceRepos:
    - '*'
  orphanedResources:
    warn: false