apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  # Declaratively reference the remote raw manifest URL
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.2/manifests/install.yaml
  - ./argocd-manifest.yaml
  - ./unified-automation.yaml
  - ./kube-kleinkram-repository-secret.yaml

patches:
  - path: ./argocd-cm-patch.yaml
  - path: ./argocd-rbac-cm-patch.yaml
  - path: ./argocd-cmd-params-cm-patch.yaml
  - path: ./argocd-server-reloader-patch.yaml
