apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
data:
  url: https://argocd.merrickcampbell.au
  oidc.config: |
    name: Dex
    issuer: https://dex.merrickcampbell.au
    clientID: argocd
    clientSecret: $argocd-dex-client-secret:ARGOCD_DEX_CLIENT_SECRET
    requestedScopes: ["openid", "profile", "email", "groups"]
