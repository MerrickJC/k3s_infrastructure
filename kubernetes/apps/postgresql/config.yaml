appName: postgresql
namespace: postgresql

hasHelm: true
hasManifests: true

helm:
  repoURL: https://cloudnative-pg.github.io/charts
  chart: cloudnative-pg
  targetRevision: 0.29.0

syncOptions:
  - ServerSideApply=true    # needed due to long CRDs

# Deleting this app's config.yaml deletes the ArgoCD Application but leaves
# the live CloudNativePG cluster/PVCs in place, instead of pruning them.
preventDeletion: true