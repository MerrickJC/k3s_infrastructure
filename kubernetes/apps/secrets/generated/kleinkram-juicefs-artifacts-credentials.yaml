---
# IAM credential kleinkram's own Argo Workflows artifact repository uses
# against the JuiceFS S3 Gateway (apps/juicefs-s3-gateway), scoped only to the
# action-artifacts bucket. Registered as a scoped mc admin user by
# apps/juicefs-s3-gateway/secrets/juicefs-gateway-iam-job.yaml
apiVersion: v1
kind: Secret
metadata:
  name: kleinkram-juicefs-artifacts-credentials
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY
    secret-generator.v1.mittwald.de/encoding: base32
    secret-generator.v1.mittwald.de/length: "32"
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "kleinkram,kleinkram-actions,juicefs"
    reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
type: Opaque
