---
# Shared OIDC client secret between Dex and the single shared apps/oauth2-proxy instance.
# This one client/secret fronts every app oauth2-proxy protects (see
# apps/oauth2-proxy/README.md for how to add a new one)
#
# The generated key is lower-hyphenated (client-secret, not an upper-snake-case env var name)
# to match oauth2-proxy's config.existingSecret expectations. This is accompanied by a small
# non-standard configuration in Dex (apps/dex/values.yaml)
apiVersion: v1
kind: Secret
metadata:
  name: oauth2-proxy-dex-client-secret
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: client-secret
    secret-generator.v1.mittwald.de/encoding: base32
    secret-generator.v1.mittwald.de/length: "32"
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "dex,oauth2-proxy"
    reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
type: Opaque
stringData:
  client-id: oauth2-proxy
