---
# Shared client secret between Dex and Grafana's OIDC config
apiVersion: v1
kind: Secret
metadata:
  name: kleinkram-dex-client-secret
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: KLEINKRAM_DEX_CLIENT_SECRET
    secret-generator.v1.mittwald.de/encoding: base32
    secret-generator.v1.mittwald.de/length: "32"
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "dex,kleinkram"
    reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
type: Opaque
stringData:
  KLEINKRAM_DEX_CLIENT_ID: kleinkram