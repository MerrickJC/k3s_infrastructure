---
# Zot registry read-only credentials for CLI/API auth. Used by applications in
# the cluster to pull images from the registry. Consuming namespaces add this as
# an imagePullSecret in their Helm charts (see
# apps/zot/secrets/zot-pull-secret-builder-job.yaml). It is also merged into Zot's
# own htpasswd file (see apps/zot/secrets/zot-htpasswd-combiner-job.yaml) so Zot
# recognizes the user. Restricted to read-only via apps/zot/values.yaml's
# config.json accessControl policy, so a leaked/compromised copy of this credential
# can only pull images, not push or delete them
# Reflected into `zot` so apps/zot/secrets/zot-htpasswd-combiner-job.yaml can
# read it from its own namespace. apps/zot/secrets/zot-pull-secret-builder-job.yaml
# reads it in-namespace since it already runs in `secrets`
apiVersion: v1
kind: Secret
metadata:
  name: zot-puller-htpasswd
  annotations:
    secret-generator.v1.mittwald.de/type: basic-auth
    secret-generator.v1.mittwald.de/basic-auth-username: puller
    secret-generator.v1.mittwald.de/length: "32"
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "zot"
    reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
type: Opaque
