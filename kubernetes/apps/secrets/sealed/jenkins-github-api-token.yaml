# Overwrite `spec.encryptedData` in this file with the `spec.encryptedData` field in the output of the command:
#   kubectl create secret generic jenkins-github-api-token --from-file=JENKINS_GITHUB_TOKEN=<file-name> -n secrets --dry-run=client -o yaml | kubeseal --format yaml
# where <file-name> is a file containing a private key

---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: jenkins-github-api-token
  namespace: secrets
spec:
  encryptedData:
    JENKINS_GITHUB_TOKEN: 
  template:
    metadata:
      name: jenkins-github-api-token
      namespace: secrets
      annotations:
        reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
        reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "jenkins"
        reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
    type: Opaque
