apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana-route
  namespace: observability
spec:
  entryPoints:
    - web         # TODO: change to websecure when you need TLS encryption
  routes:
    - match: Host(`grafana.merrickcampbell.au`)
      kind: Rule
      services:
        - name: kube-prometheus-stack-grafana
          port: 80
  ## TODO: Uncomment when you need TLS encryption (e.g. when access directly and not through cloudflare tunnel)
  # tls:
  #   secretName: grafana-tls
