apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: juicefs-s3-gateway-route
  namespace: juicefs
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`juicefs-s3.direct.merrickcampbell.au`)
      kind: Rule
      services:
        - name: juicefs-s3-gateway
          port: 9000

  tls:
    secretName: wildcard-merrickcampbell-tls
