apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jenkins-route
  namespace: jenkins
spec:
  entryPoints:
    - web         # TODO: change to websecure when you need TLS encryption
  routes:
    - match: Host(`jenkins.merrickcampbell.au`)
      kind: Rule
      services:
        - name: jenkins
          port: 8080

  ## TODO: Uncomment when you need TLS encryption (e.g. when access directly and not through cloudflare tunnel)
  # tls:
  #   secretName: jenkins-tls
