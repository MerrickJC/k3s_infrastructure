apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-server
  namespace: argocd
spec:
  entryPoints:
    - web         # TODO: change to websecure when you need TLS encryption
  routes:
    - kind: Rule
      match: Host(`argocd.merrickcampbell.au`)
      priority: 10
      services:
        - name: argocd-server
          port: 80
    - kind: Rule
      match: Host(`argocd.merrickcampbell.au`) && Header(`Content-Type`, `application/grpc`)
      priority: 11
      services:
        - name: argocd-server
          port: 80
          scheme: h2c
  ## TODO: Uncomment when you need TLS encryption (e.g. when access directly and not through cloudflare tunnel)
  # tls:
  #   secretName: argocd-tls
