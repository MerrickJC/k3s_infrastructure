apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: zot-route
  namespace: zot
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`registry.direct.merrickcampbell.au`)
      kind: Rule
      services:
        - name: zot
          port: 5000

  tls:
    secretName: wildcard-merrickcampbell-tls
