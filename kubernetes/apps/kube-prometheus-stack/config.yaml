appName: kube-prometheus-stack
namespace: observability

hasHelm: true
hasManifests: false

helm:
  repoURL: https://prometheus-community.github.io/helm-charts
  chart: kube-prometheus-stack
  targetRevision: 91.9.0

# The chart's CRDs exceed the client-side "last-applied-configuration"
# annotation size limit, so this Application syncs via server-side apply
syncOptions:
  - ServerSideApply=true

# Protects Prometheus TSDB, Grafana's own DB, and Alertmanager state from
# being wiped by an ArgoCD prune (matches apps/seaweedfs, apps/postgresql).
preventDeletion: true
