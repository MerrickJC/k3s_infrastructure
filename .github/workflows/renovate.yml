name: Renovate

# Runs the actual Renovate engine against .github/renovate.json5 on a schedule, or on
# demand via workflow_dispatch, authenticated as the MMS Renovate GitHub App (installed on
# this repo only) rather than a personal PAT - so it isn't tied to any one person's account.
#
# Auth: actions/create-github-app-token mints a short-lived (~1hr) installation token at the
# start of every run from the App's private key, which is then fed into
# renovatebot/github-action's `token` input. This is deliberately NOT the default
# secrets.GITHUB_TOKEN: GitHub blocks PRs opened with the default token from triggering
# other pull_request-triggered workflows in the same repo (anti-recursion safeguard), which
# would silently stop jenkins-jcasc-check.yml and helm-app-render-check.yml from ever
# running on Renovate's own PRs - defeating the reason this exists.
#
# Requires one repo secret: RENOVATE_APP_PRIVATE_KEY - the .pem private key generated for
# the App (App settings > Private keys > Generate a private key), added under
# Settings > Secrets and variables > Actions. The App's Client ID (Iv23lizM7Lkb4am430sm,
# below) is a public identifier, not a secret.
#
# RENOVATE_REPOSITORIES is required: unlike the hosted github.com/apps/renovate bot (which
# auto-discovers every repo it's installed on), self-hosted Renovate has no default target -
# without this it silently logs "No repositories found" and exits having scanned nothing at
# all, with no error. Verified via a real run's debug log that this was happening even after
# auth was fixed.
#
# Visibility into what Renovate did/didn't scan:
#   - Every run uploads a debug-level log as a workflow artifact (see the last step below) -
#     this is the authoritative record of exactly which files each manager matched, which
#     files were considered and rejected (and why), and what dependencies were extracted
#     from each. Download it from the run's Summary page under "Artifacts". The log is
#     written to /tmp since Renovate inside a nested Docker container and only /tmp is 
#     bind-mounted back to the runner by default.
#   - The Dependency Dashboard issue (dependencyDashboard: true in renovate.json5) is the
#     steady-state view of what Renovate currently knows about and is proposing/withholding -
#     good for "what updates exist", not for "what files did it look at".
#   - To audit config changes (e.g. after adding a new customManager) without opening or
#     touching any PRs/branches, manually dispatch this workflow with "Extract only" checked -
#     this runs Renovate in dry-run mode, so the debug log artifact reflects the new config
#     with zero side effects on the repo.

on:
  schedule:
    - cron: "0 21 * * 0" # runs weekly on Sunday 21:00 UTC = Monday 07:00 Melbourne (AEST, UTC+10)
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Extract only - scan and log what would happen, but open/update nothing (for auditing scan coverage)"
        type: boolean
        default: false

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Mint short-lived GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: Iv23lizM7Lkb4am430sm
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - name: Enable dry-run (extract-only) mode
        if: ${{ inputs.dryRun }}
        run: echo "RENOVATE_DRY_RUN=extract" >> "$GITHUB_ENV"

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.2.2
        env:
          LOG_LEVEL: debug
          RENOVATE_LOG_FILE: /tmp/renovate-debug.log
          RENOVATE_LOG_FILE_LEVEL: debug
          RENOVATE_REPOSITORIES: ${{ github.repository }}
        with:
          configurationFile: .github/renovate.json5
          token: "${{ steps.app-token.outputs.token }}"

      - name: Upload scan log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renovate-debug-log
          path: /tmp/renovate-debug.log
          retention-days: 30
