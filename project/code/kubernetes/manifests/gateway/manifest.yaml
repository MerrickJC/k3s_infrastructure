apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: main-gateway
  namespace: gateway
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  gatewayClassName: traefik
  listeners:
  - name: https-gateway
    protocol: HTTPS
    port: 443
    hostname: "*.merrickcampbell.au"
    tls:
      mode: Terminate
      certificateRefs:
      - name: https-tls # cert-manager auto-creates and manages this Secret