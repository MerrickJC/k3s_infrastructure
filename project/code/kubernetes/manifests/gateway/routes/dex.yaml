apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dex-route
  namespace: dex
spec:
  parentRefs:
  - name: main-gateway
    namespace: gateway
  hostnames:
  - "dex.merrickcampbell.au"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: dex
      port: 5556