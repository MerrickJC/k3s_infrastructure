apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-config
data:
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"
    db_engine = "sqlite"
    replication_factor = 1

    [rpc]
    bind_addr = "0.0.0.0:3901"
    rpc_secret = "a1b2c3d4e5f60123456789abcdef0123456789abcdef0123456789abcdef0123"

    [s3_api]
    s3_region = "garage"
    api_bind_addr = "0.0.0.0:3900"

    [admin]
    api_bind_addr = "0.0.0.0:3903"
    admin_token = "dev_admin_token"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: garage-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---    
apiVersion: apps/v1
kind: Deployment
metadata:
  name: garage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: garage
  template:
    metadata:
      labels:
        app: garage
    spec:
      containers:
      - name: garage
        image: dxflrs/garage:v2.3.0
        args:
        - /garage
        - server
        - --single-node
        - --default-bucket
        env:
        - name: GARAGE_DEFAULT_BUCKET
          value: "dev-bucket"
        - name: GARAGE_DEFAULT_ACCESS_KEY
          value: "GK1234567890abcdef12345678"
        - name: GARAGE_DEFAULT_SECRET_KEY
          value: "1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef"
        ports:
        - containerPort: 3900
          name: s3
        - containerPort: 3903
          name: admin
        volumeMounts:
        - name: config
          mountPath: /etc/garage.toml
          subPath: garage.toml
        - name: storage
          mountPath: /var/lib/garage
      volumes:
      - name: config
        configMap:
          name: garage-config
      - name: storage
        persistentVolumeClaim:
          claimName: garage-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: garage
spec:
  type: ClusterIP
  ports:
  - port: 3900
    targetPort: 3900
    name: s3
  - port: 3903
    targetPort: 3903
    name: admin
  selector:
    app: garage
---