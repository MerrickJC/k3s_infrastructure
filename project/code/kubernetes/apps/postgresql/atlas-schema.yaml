# Declarative desired-state schema for the `appdb` database, reconciled by the Atlas Operator.
# Atlas diffs this against the live database and applies whatever DDL is needed to converge,
# so nothing needs to be run by hand
apiVersion: db.atlasgo.io/v1alpha1
kind: AtlasSchema
metadata:
  name: appdb-schema
  namespace: postgresql
spec:
  credentials:
    scheme: postgres
    host: postgres-rw.postgresql
    user: appuser
    passwordFrom:
      secretKeyRef:
        name: postgres-app
        key: password
    database: appdb
    port: 5432
    parameters:
      sslmode: disable
  schema:
    sql: |
      CREATE TABLE "TESTING_SESSION" (
        "TS_NUMBER" serial PRIMARY KEY,
        "TS_DATE" date NOT NULL,
        "TS_PERSONNEL" text,
        "TS_NOTES" text
      );

      CREATE TABLE "ROBOT" (
        "ROBOT_ID" serial PRIMARY KEY,
        "ROBOT_NAME" text NOT NULL
      );

      CREATE TABLE "STORED_OBJECT" (
        "SO_ID" serial PRIMARY KEY,
        "SO_NAME" text NOT NULL,
        "SO_SIZE_KB" integer NOT NULL,
        "SO_CHECKSUM" bytea NOT NULL UNIQUE
      );

      CREATE TABLE "ROS_BAG" (
        "RB_ID" serial PRIMARY KEY,
        "RB_NAME" text NOT NULL UNIQUE,
        "RB_DURATION" double precision NOT NULL,
        "SO_ID" integer NOT NULL REFERENCES "STORED_OBJECT" ("SO_ID")
      );

      CREATE TABLE "MOTEC_LOG" (
        "ML_ID" serial PRIMARY KEY,
        "ML_NOTES" text,
        "SO_ID" integer NOT NULL UNIQUE REFERENCES "STORED_OBJECT" ("SO_ID")
      );

      CREATE TABLE "GIT_PATCH" (
        "GP_ID" serial PRIMARY KEY,
        "GP_GIT_COMMIT" text NOT NULL,
        "SO_ID" integer NOT NULL REFERENCES "STORED_OBJECT" ("SO_ID")
      );

      CREATE TABLE "STINT" (
        "STINT_NUMBER" serial,
        "TS_NUMBER" integer NOT NULL REFERENCES "TESTING_SESSION" ("TS_NUMBER"),
        "GP_ID" integer REFERENCES "GIT_PATCH" ("GP_ID"),
        "ML_ID" integer REFERENCES "MOTEC_LOG" ("ML_ID"),
        "RB_ID" integer NOT NULL REFERENCES "ROS_BAG" ("RB_ID"),
        "ROBOT_ID" integer NOT NULL REFERENCES "ROBOT" ("ROBOT_ID"),
        PRIMARY KEY ("STINT_NUMBER", "TS_NUMBER")
      );

      CREATE TABLE "ROS_NODE" (
        "RN_ID" serial PRIMARY KEY,
        "RN_NAME" text NOT NULL UNIQUE,
        "RN_REPO_PATH" text NOT NULL UNIQUE
      );

      -- Links which bags are good tests for which nodes
      CREATE TABLE "ROS_BAG_ROS_NODE" (
        "RB_ID" integer NOT NULL REFERENCES "ROS_BAG" ("RB_ID"),
        "RN_ID" integer NOT NULL REFERENCES "ROS_NODE" ("RN_ID"),
        PRIMARY KEY ("RB_ID", "RN_ID")
      );

      -- One row per (commit, bag, ROS node) test reduces duplicated runs
      CREATE TABLE "EXPERIMENT_RUN" (
        "ER_ID" serial PRIMARY KEY,
        "ER_GIT_COMMIT" text NOT NULL,
        "ER_IMAGE_TAG" text NOT NULL,
        "RB_ID" integer NOT NULL REFERENCES "ROS_BAG" ("RB_ID"),
        "RN_ID" integer NOT NULL REFERENCES "ROS_NODE" ("RN_ID"),
        "ER_STATUS" text NOT NULL CHECK ("ER_STATUS" IN ('queued', 'running', 'succeeded', 'failed')),
        "ER_TRIGGER_SOURCE" text NOT NULL CHECK ("ER_TRIGGER_SOURCE" IN ('jenkins', 'adhoc')),
        "ER_WORKFLOW_NAME" text,
        "ER_REQUESTED_AT" timestamptz NOT NULL DEFAULT now(),
        "ER_STARTED_AT" timestamptz,
        "ER_FINISHED_AT" timestamptz,
        UNIQUE ("ER_GIT_COMMIT", "RB_ID", "RN_ID")
      );

      CREATE TABLE "EXPERIMENT_ARTIFACT" (
        "EA_ID" serial PRIMARY KEY,
        "ER_ID" integer NOT NULL REFERENCES "EXPERIMENT_RUN" ("ER_ID"),
        "SO_ID" integer NOT NULL REFERENCES "STORED_OBJECT" ("SO_ID"),
        "EA_KIND" text NOT NULL
      );
