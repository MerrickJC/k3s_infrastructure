apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie
  storage:
    size: 20Gi
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      # No CPU limit: CNPG recommends against one, since CFS throttling hurts
      # Postgres latency. Memory limit == request for Guaranteed QoS.
      memory: "512Mi"
  bootstrap:
    initdb:
      database: appdb
      owner: appuser
