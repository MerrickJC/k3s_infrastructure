apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: juicefs-csi-driver-metrics
  namespace: juicefs
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: juicefs-csi-driver
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: juicefs-mount-metrics
  namespace: juicefs
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: juicefs-mount
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      # Each mount pod's cache lives on the node it's scheduled on, so a
      # real node label (not just the pod-scoped "instance") is needed to
      # break blockcache usage down by node on the Grafana dashboard
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
