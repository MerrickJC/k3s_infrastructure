---
# Builds the juicefs-sc-secret Secret that storageClasses[0].existingSecret
# (apps/juicefs/values.yaml) uses. Combines the generated SeaweedFS S3
# identity (apps/secrets/generated/juicefs-s3-credentials.yaml) and the
# generated Postgres role password (apps/postgresql/juicefs-database.yaml),
# both reflected into this namespace, into the single Secret that the
# juicefs-csi-driver chart expects for
# storageClasses[].existingSecret (name/metaurl/storage/access-key/secret-key/bucket).
# See apps/juicefs/secrets/README.md for why this can't be done with
# reflector/secret-generator alone. Similar justification to
# apps/seaweedfs/secrets/seaweedfs-s3-config-job.yaml.
#
# Runs on a schedule so that credential changes are automatically propagated
# (with a delay). The kubectl apply step only updates the cluster's live
# secret if there is a change. New/changed credentials only take effect on
# the next mount (existing JuiceFS mount pods aren't restarted automatically 
# since there's no static Deployment for Reloader to target (see 
# project/code/kubernetes/apps/juicefs/secrets/README.md for more details))
apiVersion: v1
kind: ServiceAccount
metadata:
  name: juicefs-sc-secret-builder
  namespace: juicefs
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: juicefs-sc-secret-builder-read
  namespace: juicefs
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["juicefs-s3-credentials", "juicefs-postgres-credentials"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: juicefs-sc-secret-builder-read
  namespace: juicefs
subjects:
  - kind: ServiceAccount
    name: juicefs-sc-secret-builder
    namespace: juicefs
roleRef:
  kind: Role
  name: juicefs-sc-secret-builder-read
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: juicefs-sc-secret-builder-write
  namespace: juicefs
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["juicefs-sc-secret"]
    verbs: ["get", "patch"]
  # can't scope 'create' to a resourceName since the resource doesn't exist
  # yet to reference by name
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: juicefs-sc-secret-builder-write
  namespace: juicefs
subjects:
  - kind: ServiceAccount
    name: juicefs-sc-secret-builder
    namespace: juicefs
roleRef:
  kind: Role
  name: juicefs-sc-secret-builder-write
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: juicefs-sc-secret-builder
  namespace: juicefs
spec:
  # changes to the underlying S3/Postgres credentials will be detected
  # within 15 minutes
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 6
      template:
        spec:
          serviceAccountName: juicefs-sc-secret-builder
          restartPolicy: Never
          containers:
            - name: build-sc-secret
              image: bitnami/kubectl:latest
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -euo pipefail

                  access_key="$(kubectl get secret juicefs-s3-credentials -o jsonpath='{.data.AWS_ACCESS_KEY_ID}' | base64 -d)"
                  secret_key="$(kubectl get secret juicefs-s3-credentials -o jsonpath='{.data.AWS_SECRET_ACCESS_KEY}' | base64 -d)"

                  # hex-encoded (see apps/postgresql/juicefs-database.yaml), so
                  # it's safe to interpolate directly into the connection URL
                  pg_user="$(kubectl get secret juicefs-postgres-credentials -o jsonpath='{.data.username}' | base64 -d)"
                  pg_password="$(kubectl get secret juicefs-postgres-credentials -o jsonpath='{.data.password}' | base64 -d)"

                  # sslmode=disable: cluster-internal traffic only, and the
                  # "postgres" Cluster (apps/postgresql) doesn't distribute
                  # client TLS certs outside its own namespace
                  metaurl="postgres://${pg_user}:${pg_password}@postgres-rw.postgresql.svc.cluster.local:5432/juicefs?sslmode=disable"
                  bucket="http://seaweedfs.seaweedfs.svc.cluster.local:9000/juicefs"

                  kubectl create secret generic juicefs-sc-secret \
                    --from-literal=name=juicefs \
                    --from-literal=metaurl="${metaurl}" \
                    --from-literal=storage=s3 \
                    --from-literal=access-key="${access_key}" \
                    --from-literal=secret-key="${secret_key}" \
                    --from-literal=bucket="${bucket}" \
                    --dry-run=client -o yaml | kubectl apply -f -
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                runAsNonRoot: true
