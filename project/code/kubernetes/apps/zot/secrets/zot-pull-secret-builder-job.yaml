---
# Builds a Kubernetes-native `kubernetes.io/dockerconfigjson` secret
# (zot-pull-secret, namespace secrets) from the read-only puller credential
# (apps/secrets/generated/zot-puller-htpasswd.yaml), in the exact shape an
# imagePullSecret needs. Every consuming namespace attaches it via
# `imagePullSecrets: [{name: zot-pull-secret}]` in that app's Helm values.
# See apps/zot/secrets/README.md for more info.
#
# Runs on a schedule so that credential rotation is automatically propagated
# (with a delay). The reflection-allowed-namespaces annotation (see code below)
# is reapplied on every run. When a new namespace needs to pull private images,
# add it there
apiVersion: v1
kind: ServiceAccount
metadata:
  name: zot-pull-secret-builder
  namespace: secrets
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zot-pull-secret-builder
  namespace: secrets
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["zot-puller-htpasswd"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["zot-pull-secret"]
    verbs: ["get", "patch"]
  # can't scope 'create' to a resourceName since the resource doesn't exist
  # yet to reference by name
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zot-pull-secret-builder
  namespace: secrets
subjects:
  - kind: ServiceAccount
    name: zot-pull-secret-builder
    namespace: secrets
roleRef:
  kind: Role
  name: zot-pull-secret-builder
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: zot-pull-secret-builder
  namespace: secrets
spec:
  # changes to zot-puller-htpasswd will be detected within 15 minutes
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 6
      template:
        spec:
          serviceAccountName: zot-pull-secret-builder
          restartPolicy: Never
          containers:
            - name: build-pull-secret
              image: bitnami/kubectl:latest
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -euo pipefail
                  USERNAME="$(kubectl get secret zot-puller-htpasswd -n secrets -o jsonpath='{.data.username}' | base64 -d)"
                  PASSWORD="$(kubectl get secret zot-puller-htpasswd -n secrets -o jsonpath='{.data.password}' | base64 -d)"
                  kubectl create secret docker-registry zot-pull-secret -n secrets \
                    --docker-server=registry.direct.merrickcampbell.au \
                    --docker-username="${USERNAME}" \
                    --docker-password="${PASSWORD}" \
                    --dry-run=client -o yaml \
                  | kubectl annotate --local -f - -o yaml \
                    reflector.v1.k8s.emberstack.com/reflection-allowed=true \
                    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces=kleinkram,juicefs \
                    reflector.v1.k8s.emberstack.com/reflection-auto-enabled=true \
                  | kubectl apply -f -
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                runAsNonRoot: true
