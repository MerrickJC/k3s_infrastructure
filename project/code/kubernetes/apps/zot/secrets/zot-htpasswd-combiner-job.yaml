---
# Builds the combined htpasswd file (zot-htpasswd-combined) that Zot's
# config.json expects in http.auth.htpasswd.path. Concatenates the admin
# credential (apps/secrets/generated/zot-htpasswd.yaml) with the read-only
# puller credential (apps/secrets/generated/zot-puller-htpasswd.yaml). This
# is required since secret-generator's basic-auth type only produces one
# username's htpasswd line per secret, and Zot needs every user in a single
# mounted file. See apps/zot/secrets/README.md for more info.
#
# Runs on a schedule so that credential rotation/addition is automatically
# propagated (with a delay). apps/zot/values.yaml's reloader.stakater.com/auto
# annotation restarts the Zot pod once the mounted secret actually changes.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: zot-htpasswd-combiner
  namespace: zot
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zot-htpasswd-combiner-read
  namespace: secrets
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["zot-htpasswd", "zot-puller-htpasswd"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zot-htpasswd-combiner-read
  namespace: secrets
subjects:
  - kind: ServiceAccount
    name: zot-htpasswd-combiner
    namespace: zot
roleRef:
  kind: Role
  name: zot-htpasswd-combiner-read
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zot-htpasswd-combiner-write
  namespace: zot
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["zot-htpasswd-combined"]
    verbs: ["get", "patch"]
  # can't scope 'create' to a resourceName since the resource doesn't exist
  # yet to reference by name
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zot-htpasswd-combiner-write
  namespace: zot
subjects:
  - kind: ServiceAccount
    name: zot-htpasswd-combiner
    namespace: zot
roleRef:
  kind: Role
  name: zot-htpasswd-combiner-write
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: zot-htpasswd-combiner
  namespace: zot
spec:
  # changes to either source secret will be detected within 15 minutes
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 6
      template:
        spec:
          serviceAccountName: zot-htpasswd-combiner
          restartPolicy: Never
          containers:
            - name: combine-htpasswd
              image: bitnami/kubectl:latest
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -euo pipefail
                  ADMIN_LINE="$(kubectl get secret zot-htpasswd -n secrets -o jsonpath='{.data.auth}' | base64 -d)"
                  PULLER_LINE="$(kubectl get secret zot-puller-htpasswd -n secrets -o jsonpath='{.data.auth}' | base64 -d)"
                  printf '%s\n%s\n' "${ADMIN_LINE}" "${PULLER_LINE}" > /tmp/combined-auth
                  kubectl create secret generic zot-htpasswd-combined -n zot \
                    --from-file=auth=/tmp/combined-auth \
                    --dry-run=client -o yaml | kubectl apply -f -
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                runAsNonRoot: true
