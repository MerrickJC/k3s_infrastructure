---
# Builds the zot-oidc-credentials JSON secret (namespace zot) that Zot's
# OIDC credentialsFile config expects, from the generated
# zot-dex-client-secret value (apps/secrets/generated/dex-zot-client-token.yaml).
# See apps/zot/secrets/README.md section 3 for more info
#
# Runs on a schedule so that secret changes are automatically propogated
# (although with a delay). While it creates a newly structured secret every
# run, the kubectl apply step will only update the cluster's live secret if
# there is a change. apps/zot/values.yaml's reloader.stakater.com/auto
# annotation (apps/reloader, Stakater Reloader) picks that change up and
# restarts the Zot pod, since Zot doesn't reload a mounted credentials file
# on its own. See apps/reloader/README.md for details.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: zot-oidc-credentials-builder
  namespace: zot
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zot-oidc-credentials-builder-read
  namespace: secrets
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["zot-dex-client-secret"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zot-oidc-credentials-builder-read
  namespace: secrets
subjects:
  - kind: ServiceAccount
    name: zot-oidc-credentials-builder
    namespace: zot
roleRef:
  kind: Role
  name: zot-oidc-credentials-builder-read
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zot-oidc-credentials-builder-write
  namespace: zot
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["zot-oidc-credentials"]
    verbs: ["get", "patch"]
  # can't scope 'create' to a resourceName since the resource doesn't exist
  # yet to reference by name
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zot-oidc-credentials-builder-write
  namespace: zot
subjects:
  - kind: ServiceAccount
    name: zot-oidc-credentials-builder
    namespace: zot
roleRef:
  kind: Role
  name: zot-oidc-credentials-builder-write
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: zot-oidc-credentials-builder
  namespace: zot
spec:
  # changes to zot-dex-client-secret will be detected within 15 minutes
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 6
      template:
        spec:
          serviceAccountName: zot-oidc-credentials-builder
          restartPolicy: Never
          containers:
            - name: build-credentials-file
              image: bitnami/kubectl:latest
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -euo pipefail
                  VALUE="$(kubectl get secret zot-dex-client-secret -n secrets -o jsonpath='{.data.ZOT_DEX_CLIENT_SECRET}' | base64 -d)"
                  JSON="{\"clientid\":\"zot\",\"clientsecret\":\"${VALUE}\"}"
                  kubectl create secret generic zot-oidc-credentials -n zot \
                    --from-literal=oidc-credentials.json="${JSON}" \
                    --dry-run=client -o yaml | kubectl apply -f -
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                runAsNonRoot: true
