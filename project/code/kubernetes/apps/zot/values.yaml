replicaCount: 1

# Restarts the pod when Secrets/ConfigMaps change
deploymentAnnotations:
  reloader.stakater.com/auto: "true"

service:
  type: ClusterIP   # chart default is NodePort but we use Traefik IngressRoute instead
  port: 5000

persistence: false   # all blob data lives in the zot-registry S3 bucket, no local PVC needed

ingress:
  enabled: false      # don't use chart default, create our own IngressRoute
httproute:
  enabled: false

# No dedicated values.yaml schema exists for the S3 storage driver or OIDC auth, so both
# are written out here as zot native configs
#
# http.auth.bearer (GitHub Actions OIDC token trust) is intentionally NOT configured
# here even though it's the more secure option (keyless, short-lived, repo/branch-scoped).
# zot v2.1.21 disables ALL other auth methods, including openid.oidc web login, whenever
# bearer.oidc is also configured (https://github.com/project-zot/zot/issues/4033). Until
# a fix is shipped, GitHub Actions pushes use the dedicated `pusher` htpasswd credential
# instead. See apps/secrets/generated/zot-pusher-htpasswd.yaml. Revisit re-adding
# bearer.oidc (and retiring the pusher credential) once Zot fixes the issue.
mountConfig: true
configFiles:
  config.json: |-
    {
      "distSpecVersion": "1.1.1",
      "storage": {
        "rootDirectory": "/var/lib/registry",
        "dedupe": false,
        "storageDriver": {
          "name": "s3",
          "rootdirectory": "/zot",
          "region": "us-east-1",
          "regionendpoint": "http://seaweedfs-all-in-one.seaweedfs.svc.cluster.local:9000",
          "bucket": "zot-registry",
          "forcepathstyle": true,
          "secure": false,
          "skipverify": true
        }
      },
      "http": {
        "address": "0.0.0.0",
        "port": "5000",
        "externalUrl": "https://registry.merrickcampbell.au",
        "auth": {
          "htpasswd": {
            "path": "/secrets/htpasswd/auth"
          },
          "openid": {
            "providers": {
              "oidc": {
                "name": "Dex",
                "issuer": "https://dex.merrickcampbell.au",
                "credentialsFile": "/secrets/oidc/oidc-credentials.json",
                "keypath": "",
                "scopes": ["openid", "profile", "email", "groups"]
              }
            }
          }
        },
        "accessControl": {
          "repositories": {
            "**": {
              "policies": [
                {
                  "users": ["puller"],
                  "actions": ["read"]
                }
              ],
              "defaultPolicy": ["read", "create", "update"]
            }
          },
          "adminPolicy": {
            "users": ["admin"],
            "actions": ["read", "create", "update", "delete"]
          }
        }
      },
      "log": {"level": "info"},
      "extensions": {
        "search": {"enable": true},
        "ui": {"enable": true}
      }
    }

# since accesskey/secretkey are omitted from storageDriver above, Zot defaults
# to standard AWS SDK env-var credentials (AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY,
# specified below). This prevents credentials from appearing in the ConfigMap
env:
  - name: AWS_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: zot-s3-credentials
        key: AWS_ACCESS_KEY_ID
  - name: AWS_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: zot-s3-credentials
        key: AWS_SECRET_ACCESS_KEY

# The chart's mountSecret/secretFiles render as plaintext into values.yaml,
# which is undesirable for sensitive information, so we mount them instead
# as externalSecrets
mountSecret: false

externalSecrets:
  - secretName: zot-htpasswd-combined   # admin + puller + pusher users merged, see apps/zot/secrets/README.md
    mountPath: /secrets/htpasswd
  - secretName: zot-oidc-credentials
    mountPath: /secrets/oidc
