# Only keys that differ from the chart's defaults are listed.
# Anything not mentioned here uses the chart's default as-is.

# Lets apps/reloader restart any Deployment whose mounted Secret/ConfigMap changes
commonAnnotations:
  reloader.stakater.com/auto: 'true'

image:
  # Pull from our private Zot registry
  pullSecrets:
    - zot-pull-secret

# Action images also pull from the private Zot registry
actions:
  imagePullSecrets:
    - zot-pull-secret

config:
  # Externally reachable ingress. Backed by the JuiceFS S3 Gateway
  # (apps/juicefs-s3-gateway)
  s3Endpoint: 'https://juicefs-s3.direct.merrickcampbell.au'
  # Internal address
  s3EndpointInternal: 'http://juicefs-s3-gateway.juicefs.svc.cluster.local:9000'
  s3DataBucketName: data
  s3DbBucketName: dbdumps

  # Port/database name already match the chart's defaults (5432 / kleinkram)
  dbHost: postgres-rw.postgresql.svc.cluster.local

  frontendUrl: 'https://kleinkram.merrickcampbell.au'
  docsUrl: 'https://kleinkram-docs.merrickcampbell.au'
  backendUrl: 'https://kleinkram-api.merrickcampbell.au'

  oidcIssuerUrl: 'https://dex.merrickcampbell.au'
  oidcDisplayName: 'Dex'

  dockerHubNamespace: ""

observability:
  prometheusUrl: 'http://kube-prometheus-stack-prometheus.observability.svc:9090'

secretNames:
  # Also used directly by Postgres, so this is the same Secret it is authenticated
  # against
  db: kleinkram-postgres-credentials
  # JuiceFS S3 Gateway IAM user with readwrite access to every bucket (see
  # apps/juicefs-s3-gateway/README.md)
  s3: kleinkram-juicefs-credentials
  # Reuses the same GitHub OAuth App credentials as Dex as a temporary workaround
  # until full OIDC support is added (so that Dex can be used). secretKeys.githubOauth
  # use the chart's defaults
  githubOauth: dex-github-oauth

  oidcOauth: kleinkram-dex-client-secret

secretKeys:
  db:
    user: username
    password: password
  s3:
    accessKey: AWS_ACCESS_KEY_ID
    secretKey: AWS_SECRET_ACCESS_KEY
    user: AWS_ACCESS_KEY_ID
    password: AWS_SECRET_ACCESS_KEY
  oidcOauth:
    clientId: KLEINKRAM_DEX_CLIENT_ID
    clientSecret: KLEINKRAM_DEX_CLIENT_SECRET
  dbDump:
    user: username
    password: password

# Dedicated JuiceFS S3 Gateway IAM user (apps/juicefs-s3-gateway/README.md),
# scoped to only the action-artifacts bucket, for ephemeral Action's Argo
# Workflow to upload artifacts. kleinkram-artifact-repository ConfigMap is
# chart-rendered and picks up config.s3EndpointInternal above automatically
argo:
  artifactRepository:
    credentialsSecretName: kleinkram-juicefs-artifacts-credentials
    credentialsSecretKeys:
      accessKey: AWS_ACCESS_KEY_ID
      secretKey: AWS_SECRET_ACCESS_KEY

networkPolicy:
  enabled: false

kueue:
  resourceFlavors:
    cpu:
      name: cpu-default
      # Confines Action pods to the kleinkram-actionsnode pool (tainted with a
      # matching key/value)
      nodeSelector:
        merrickcampbell.au/node-role: kleinkram-actions
      tolerations:
        - key: merrickcampbell.au/node-role
          operator: Equal
          value: kleinkram-actions
          effect: NoSchedule
  quota:
    cpu:
      cpu: '6'
      memory: 12Gi
    gpu:
      nvidiaGpu: '2'

locality:
  nodeLabelSelector: merrickcampbell.au/node-role=kleinkram-actions
  tierSizes: '1,2,3'
