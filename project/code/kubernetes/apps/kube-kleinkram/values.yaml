# Only keys that differ from the chart's defaults are listed.
# Anything not mentioned here uses the chart's default as-is.

image:
  # Pull from our private Zot registry
  pullSecrets:
    - zot-pull-secret
  
config:
  s3Endpoint: 'http://seaweedfs-all-in-one.seaweedfs.svc.cluster.local:9000'
  s3DataBucketName: data
  s3DbBucketName: dbdumps

  # Port/database name already match the chart's defaults (5432 / kleinkram)
  dbHost: postgres-rw.postgresql.svc.cluster.local

  frontendUrl: 'https://kleinkram.merrickcampbell.au'
  docsUrl: 'https://docs.kleinkram.merrickcampbell.au'
  backendUrl: 'https://api.kleinkram.merrickcampbell.au'

  # TODO: this is mock auth for testing, replace with real auth later
  vitePublicOauthFake: 'true'

observability:
  prometheusUrl: 'http://kube-prometheus-stack-prometheus.observability.svc:9090'

secretNames:
  # Also used directly by Postgres, so this is the same Secret it is authenticated
  # against
  db: kleinkram-postgres-credentials
  # kleinkram-backend SeaweedFS identity has full access to the buckets this app uses
  s3: kleinkram-backend-s3-credentials

secretKeys:
  db:
    user: username
    password: password
  s3:
    accessKey: AWS_ACCESS_KEY_ID
    secretKey: AWS_SECRET_ACCESS_KEY
    user: AWS_ACCESS_KEY_ID
    password: AWS_SECRET_ACCESS_KEY

# Dedicated SeaweedFS identity for ephemeral Action's Argo Workflow to upload 
# artifacts. kleinkram-artifact-repository ConfigMap (uses chart default name
# so isn't overwritten) lives at apps/kube-kleinkram/artifact-repository-configmap.yaml
argo:
  artifactRepository:
    credentialsSecretName: kleinkram-artifact-s3-credentials
    credentialsSecretKeys:
      accessKey: AWS_ACCESS_KEY_ID
      secretKey: AWS_SECRET_ACCESS_KEY

