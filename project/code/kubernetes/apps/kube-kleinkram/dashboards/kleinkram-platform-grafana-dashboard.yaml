          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 40 },
          "id": 403,
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi" } },
          "targets": [ { "expr": "sum(rate(juicefs_blockcache_hits[5m])) by (vol_name) / (sum(rate(juicefs_blockcache_hits[5m])) by (vol_name) + sum(rate(juicefs_blockcache_miss[5m])) by (vol_name))", "legendFormat": "{{vol_name}}", "refId": "A" } ],
          "title": "Blockcache Hit Ratio",
          "type": "timeseries"
        },
        {
          "datasource": null,
          "fieldConfig": { "defaults": { "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2 }, "unit": "short" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 48 },
          "id": 404,
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi" } },
          "targets": [ { "expr": "sum(rate(juicefs_object_request_errors[5m])) by (vol_name)", "legendFormat": "{{vol_name}}", "refId": "A" } ],
          "title": "Object Storage Request Error Rate",
