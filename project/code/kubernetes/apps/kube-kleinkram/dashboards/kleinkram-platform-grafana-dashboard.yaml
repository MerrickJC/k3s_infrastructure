            { "expr": "sum(rate(juicefs_fuse_written_size_bytes_sum[5m])) by (vol_name)", "legendFormat": "{{vol_name}} write", "refId": "B" }
          ],
          "title": "FUSE Read/Write Throughput",
          "type": "timeseries"
        },

        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 56 },
          "id": 500,
          "panels": [],
          "title": "SeaweedFS",
