          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 23 },
          "id": 301,
          "options": { "legend": { "displayMode": "table", "placement": "right", "showLegend": true }, "tooltip": { "mode": "multi" } },
          "targets": [ { "expr": "sum(kueue_pending_workloads) by (cluster_queue, status)", "legendFormat": "{{cluster_queue}} ({{status}})", "refId": "A" } ],
          "title": "Pending Workloads by ClusterQueue",
          "type": "timeseries"
        },
        {
          "datasource": null,
          "fieldConfig": { "defaults": { "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2 }, "unit": "short" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 23 },
          "id": 302,
          "options": { "legend": { "displayMode": "table", "placement": "right", "showLegend": true }, "tooltip": { "mode": "multi" } },
          "targets": [ { "expr": "sum(kueue_admitted_active_workloads) by (cluster_queue)", "legendFormat": "{{cluster_queue}}", "refId": "A" } ],
          "title": "Admitted Active Workloads by ClusterQueue",
          "type": "timeseries"
        },
        {
          "datasource": null,
          "description": "Covers both kleinkram-cluster-queue (kleinkram Actions, cpu-default/gpu-default flavors) and experiment-execution (experiment-burst flavor). Requires kueue's metrics.enableClusterQueueResources flag.",
          "fieldConfig": { "defaults": { "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2 }, "unit": "short" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 31 },
          "id": 303,
          "options": { "legend": { "displayMode": "table", "placement": "right", "showLegend": true }, "tooltip": { "mode": "multi" } },
          "targets": [
            { "expr": "sum(kueue_cluster_queue_resource_usage) by (cluster_queue, resource)", "legendFormat": "{{cluster_queue}} {{resource}} used", "refId": "A" },
            { "expr": "sum(kueue_cluster_queue_nominal_quota) by (cluster_queue, resource)", "legendFormat": "{{cluster_queue}} {{resource}} quota", "refId": "B" }
          ],
          "title": "ClusterQueue Resource Usage vs. Nominal Quota",
          "type": "timeseries"
        },
        {
          "datasource": null,
