apiVersion: v1
kind: ConfigMap
metadata:
  name: kleinkram-platform-grafana-dashboard
  namespace: kleinkram
  labels:
    grafana_dashboard: "1"
data:
  kleinkram-platform-dashboard.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": { "type": "grafana", "uid": "-- Grafana --" },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 100,
          "panels": [],
          "title": "Platform Health",
          "type": "row"
        },
        {
          "datasource": null,
          "description": "job label regex unverified against a live target.",
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "options": { "0": { "text": "Down", "color": "red" }, "1": { "text": "Up", "color": "green" } }, "type": "value" }
              ],
              "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 1 } ] }
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 1 },
          "id": 101,
          "options": { "colorMode": "background", "graphMode": "none", "justifyMode": "center", "orientation": "horizontal", "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "textMode": "auto" },
          "pluginVersion": "11.0.0",
          "targets": [ { "expr": "max(up{job=~\".*workflow-controller.*\"})", "refId": "A" } ],
          "title": "Argo Workflows Controller",
          "type": "stat"
        },
        {
          "datasource": null,
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "options": { "0": { "text": "Down", "color": "red" }, "1": { "text": "Up", "color": "green" } }, "type": "value" }
              ],
              "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 1 } ] }
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 1 },
          "id": 102,
          "options": { "colorMode": "background", "graphMode": "none", "justifyMode": "center", "orientation": "horizontal", "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "textMode": "auto" },
          "pluginVersion": "11.0.0",
          "targets": [ { "expr": "max(up{job=~\".*kueue.*\"})", "refId": "A" } ],
          "title": "Kueue Controller",
          "type": "stat"
        },
        {
          "datasource": null,
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "options": { "0": { "text": "Down", "color": "red" }, "1": { "text": "Up", "color": "green" } }, "type": "value" }
              ],
              "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 1 } ] }
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 1 },
          "id": 103,
          "options": { "colorMode": "background", "graphMode": "none", "justifyMode": "center", "orientation": "horizontal", "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "textMode": "auto" },
          "pluginVersion": "11.0.0",
          "targets": [ { "expr": "max(up{job=~\".*juicefs-s3-gateway.*\"})", "refId": "A" } ],
          "title": "JuiceFS S3 Gateway",
          "type": "stat"
        },
        {
          "datasource": null,
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "options": { "0": { "text": "Down", "color": "red" }, "1": { "text": "Up", "color": "green" } }, "type": "value" }
              ],
              "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 1 } ] }
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 1 },
          "id": 104,
          "options": { "colorMode": "background", "graphMode": "none", "justifyMode": "center", "orientation": "horizontal", "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "textMode": "auto" },
          "pluginVersion": "11.0.0",
          "targets": [ { "expr": "max(up{job=~\".*seaweedfs.*\"})", "refId": "A" } ],
          "title": "SeaweedFS",
          "type": "stat"
        },
        {
          "datasource": null,
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "options": { "0": { "text": "Down", "color": "red" }, "1": { "text": "Up", "color": "green" } }, "type": "value" }
              ],
              "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 1 } ] }
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 4, "x": 16, "y": 1 },
          "id": 105,
          "options": { "colorMode": "background", "graphMode": "none", "justifyMode": "center", "orientation": "horizontal", "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "textMode": "auto" },
          "pluginVersion": "11.0.0",
          "targets": [ { "expr": "max(up{job=~\".*postgres.*\"})", "refId": "A" } ],
          "title": "PostgreSQL (CNPG)",
          "type": "stat"
        },
        {
          "datasource": null,
          "description": "min() so this only reads 'Up' once every node's gateway pod (DaemonSet, one per node) is running.",
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "options": { "0": { "text": "Down", "color": "red" }, "1": { "text": "Up", "color": "green" } }, "type": "value" }
              ],
              "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 1 } ] }
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 4, "x": 20, "y": 1 },
          "id": 106,
          "options": { "colorMode": "background", "graphMode": "none", "justifyMode": "center", "orientation": "horizontal", "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "textMode": "auto" },
          "pluginVersion": "11.0.0",
          "targets": [ { "expr": "min(up{job=~\".*juicefs-s3-gateway.*\"})", "refId": "A" } ],
          "title": "JuiceFS S3 Gateway (all nodes)",
          "type": "stat"
        },

        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 5 },
          "id": 200,
          "panels": [],
          "title": "Argo Workflows",
          "type": "row"
        },
        {
          "datasource": null,
          "fieldConfig": {
            "defaults": { "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2 }, "unit": "short" },
            "overrides": [
              { "matcher": { "id": "byName", "options": "Succeeded" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "green" } } ] },
              { "matcher": { "id": "byName", "options": "Running" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "blue" } } ] },
              { "matcher": { "id": "byName", "options": "Pending" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "yellow" } } ] },
              { "matcher": { "id": "byName", "options": "Failed" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "orange" } } ] },
              { "matcher": { "id": "byName", "options": "Error" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } } ] }
            ]
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "id": 201,
          "options": { "legend": { "displayMode": "table", "placement": "right", "showLegend": true }, "tooltip": { "mode": "multi" } },
          "targets": [ { "expr": "sum(argo_workflows_gauge) by (phase)", "legendFormat": "{{phase}}", "refId": "A" } ],
          "title": "Workflow Count by Phase",
          "type": "timeseries"
        },
        {
          "datasource": null,
          "fieldConfig": {
            "defaults": { "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2 }, "unit": "short" },
            "overrides": [
              { "matcher": { "id": "byName", "options": "Succeeded" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "green" } } ] },
              { "matcher": { "id": "byName", "options": "Running" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "blue" } } ] },
              { "matcher": { "id": "byName", "options": "Pending" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "yellow" } } ] },
              { "matcher": { "id": "byName", "options": "Failed" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "orange" } } ] },
              { "matcher": { "id": "byName", "options": "Error" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } } ] }
            ]
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
          "id": 202,
          "options": { "legend": { "displayMode": "table", "placement": "right", "showLegend": true }, "tooltip": { "mode": "multi" } },
          "targets": [ { "expr": "sum(argo_workflows_pods_gauge) by (phase)", "legendFormat": "{{phase}}", "refId": "A" } ],
          "title": "Workflow Pods by Phase",
          "type": "timeseries"
        },
        {
          "datasource": null,
          "description": "Depth of the controller's internal work queues. Sustained growth means the controller isn't keeping up.",
          "fieldConfig": { "defaults": { "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2 }, "unit": "short" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 14 },
          "id": 203,
          "options": { "legend": { "displayMode": "table", "placement": "right", "showLegend": true }, "tooltip": { "mode": "multi" } },
          "targets": [ { "expr": "argo_workflows_queue_depth_gauge", "legendFormat": "{{queue_name}}", "refId": "A" } ],
          "title": "Controller Queue Depth",
          "type": "timeseries"
        },
        {
          "datasource": null,
          "fieldConfig": { "defaults": { "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2 }, "unit": "s" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 14 },
          "id": 204,
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "multi" } },
          "targets": [ { "expr": "histogram_quantile(0.95, sum(rate(argo_workflows_operation_duration_seconds_bucket[5m])) by (le))", "legendFormat": "p95 reconcile duration", "refId": "A" } ],
          "title": "Reconciliation Duration (p95)",
          "type": "timeseries"
        },

        {
          "datasource": null,
          "description": "Running Argo Workflow pods per node, scoped to the kleinkram-actions namespace. Needs kube-state-metrics' --metric-labels-allowlist exposing workflows.argoproj.io/workflow on kube_pod_labels (apps/kube-prometheus-stack/values.yaml).",
          "fieldConfig": { "defaults": { "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2 }, "unit": "short" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 22 },
          "id": 704,
          "options": { "legend": { "displayMode": "table", "placement": "right", "showLegend": true }, "tooltip": { "mode": "multi" } },
          "targets": [
            { "expr": "count((kube_pod_status_phase{namespace=\"kleinkram-actions\", phase=\"Running\"} == 1) * on(namespace, pod) group_left() kube_pod_labels{label_workflows_argoproj_io_workflow!=\"\"} * on(namespace, pod) group_left(node) kube_pod_info) by (node)", "legendFormat": "{{node}}", "refId": "A" }
          ],
          "title": "Argo Workflow Pods Running per Node (kleinkram-actions)",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 30 },
          "id": 300,
          "panels": [],
          "title": "Kueue",
          "type": "row"
        },
        {
          "datasource": null,
          "fieldConfig": { "defaults": { "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2 }, "unit": "short" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 31 },
          "id": 301,
          "options": { "legend": { "displayMode": "table", "placement": "right", "showLegend": true }, "tooltip": { "mode": "multi" } },
          "targets": [ { "expr": "sum(kueue_pending_workloads) by (cluster_queue, status)", "legendFormat": "{{cluster_queue}} ({{status}})", "refId": "A" } ],
          "title": "Pending Workloads by ClusterQueue",
          "type": "timeseries"
        },
        {
          "datasource": null,
          "fieldConfig": { "defaults": { "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2 }, "unit": "short" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 31 },
          "id": 302,
          "options": { "legend": { "displayMode": "table", "placement": "right", "showLegend": true }, "tooltip": { "mode": "multi" } },
          "targets": [ { "expr": "sum(kueue_admitted_active_workloads) by (cluster_queue)", "legendFormat": "{{cluster_queue}}", "refId": "A" } ],
          "title": "Admitted Active Workloads by ClusterQueue",
          "type": "timeseries"
        },
        {
          "datasource": null,
          "description": "Covers kleinkram-cluster-queue (cpu-default/gpu-default) and experiment-execution (experiment-burst). Requires kueue's metrics.enableClusterQueueResources flag.",
          "fieldConfig": { "defaults": { "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2 }, "unit": "short" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 39 },
          "id": 303,
          "options": { "legend": { "displayMode": "table", "placement": "right", "showLegend": true }, "tooltip": { "mode": "multi" } },
          "targets": [
            { "expr": "sum(kueue_cluster_queue_resource_usage) by (cluster_queue, resource)", "legendFormat": "{{cluster_queue}} {{resource}} used", "refId": "A" },
            { "expr": "sum(kueue_cluster_queue_nominal_quota) by (cluster_queue, resource)", "legendFormat": "{{cluster_queue}} {{resource}} quota", "refId": "B" }
          ],
          "title": "ClusterQueue Resource Usage vs. Nominal Quota",
          "type": "timeseries"
        },
        {
          "datasource": null,
          "description": "local_queue/name label unverified against a live target; kleinkram's Actions LocalQueue is named kleinkram-actions.",
          "fieldConfig": { "defaults": { "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2 }, "unit": "short" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 39 },
          "id": 304,
          "options": { "legend": { "displayMode": "table", "placement": "right", "showLegend": true }, "tooltip": { "mode": "multi" } },
          "targets": [ { "expr": "sum(kueue_local_queue_pending_workloads) by (cluster_queue, name)", "legendFormat": "{{name}}", "refId": "A" } ],
          "title": "LocalQueue Pending Workloads (kleinkram-actions)",
          "type": "timeseries"
        },

        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 47 },
          "id": 400,
          "panels": [],
          "title": "JuiceFS",
          "type": "row"
        },
        {
          "datasource": null,
          "description": "One line per node (DaemonSet, independent cache per node). A line flatlining near zero after uploads indicates block-size cache bypass - see Network Transfer Rate panel.",
          "fieldConfig": { "defaults": { "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2 }, "unit": "bytes" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 48 },
          "id": 406,
          "options": { "legend": { "displayMode": "table", "placement": "right", "showLegend": true }, "tooltip": { "mode": "multi" } },
          "targets": [ { "expr": "sum(juicefs_blockcache_bytes) by (instance, node, mp, vol_name)", "legendFormat": "{{node}} ({{vol_name}})", "refId": "A" } ],
          "title": "Cache Usage by Gateway Node",
          "type": "timeseries"
        },
        {
          "datasource": null,
          "description": "A node persistently lower than its peers points to a node-specific cause (cold cache, disk nearing eviction threshold, different traffic) rather than a gateway-wide issue.",
          "fieldConfig": { "defaults": { "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2 }, "max": 1, "min": 0, "unit": "percentunit" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 48 },
          "id": 403,
          "options": { "legend": { "displayMode": "table", "placement": "right", "showLegend": true }, "tooltip": { "mode": "multi" } },
          "targets": [ { "expr": "sum(rate(juicefs_blockcache_hits[5m])) by (node, vol_name) / (sum(rate(juicefs_blockcache_hits[5m])) by (node, vol_name) + sum(rate(juicefs_blockcache_miss[5m])) by (node, vol_name))", "legendFormat": "{{node}} ({{vol_name}})", "refId": "A" } ],
          "title": "Blockcache Hit Ratio by Node",
          "type": "timeseries"
        },
        {
          "datasource": null,
          "description": "Broken out by node so a node-specific connectivity problem shows up as one line spiking, rather than being averaged into a backend-wide signal.",
          "fieldConfig": { "defaults": { "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2 }, "unit": "short" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 56 },
          "id": 404,
          "options": { "legend": { "displayMode": "table", "placement": "right", "showLegend": true }, "tooltip": { "mode": "multi" } },
          "targets": [ { "expr": "sum(rate(juicefs_object_request_errors[5m])) by (node, vol_name)", "legendFormat": "{{node}} ({{vol_name}})", "refId": "A" } ],
          "title": "Object Storage Request Error Rate by Node",
          "type": "timeseries"
        },
        {
          "datasource": null,
          "description": "A PUT immediately followed by a same-sized GET on the same node is the write-then-reread pattern: writes at or above the filesystem's block size (4MiB default) bypass the local cache, so most ROS bag uploads are guaranteed cache misses on read-back.",
          "fieldConfig": { "defaults": { "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2 }, "unit": "Bps" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 56 },
          "id": 407,
          "options": { "legend": { "displayMode": "table", "placement": "right", "showLegend": true }, "tooltip": { "mode": "multi" } },
          "targets": [
            { "expr": "sum(rate(juicefs_object_request_data_bytes{method=\"GET\"}[5m])) by (node, vol_name)", "legendFormat": "{{node}} ({{vol_name}}) download", "refId": "A" },
            { "expr": "sum(rate(juicefs_object_request_data_bytes{method=\"PUT\"}[5m])) by (node, vol_name)", "legendFormat": "{{node}} ({{vol_name}}) upload", "refId": "B" }
          ],
          "title": "Network Transfer Rate to Object Store by Node",
          "type": "timeseries"
        },
        {
          "datasource": null,
          "description": "Total bytes downloaded from the object store over the selected time range - the network cost of cache misses.",
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 64 },
          "id": 408,
          "options": { "colorMode": "value", "graphMode": "none", "justifyMode": "center", "orientation": "horizontal", "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "textMode": "auto" },
          "targets": [ { "expr": "sum(increase(juicefs_object_request_data_bytes{method=\"GET\"}[$__range]))", "refId": "A" } ],
          "title": "Downloaded from Object Store (range)",
          "type": "stat"
        },
        {
          "datasource": null,
          "description": "Total bytes uploaded to the object store over the selected time range.",
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 64 },
          "id": 409,
          "options": { "colorMode": "value", "graphMode": "none", "justifyMode": "center", "orientation": "horizontal", "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "textMode": "auto" },
          "targets": [ { "expr": "sum(increase(juicefs_object_request_data_bytes{method=\"PUT\"}[$__range]))", "refId": "A" } ],
          "title": "Uploaded to Object Store (range)",
          "type": "stat"
        },
        {
          "datasource": null,
          "description": "An average PUT size near the 4MiB block size confirms uploads on that node bypass the local cache - the likely cause of a write-then-reread pattern.",
          "fieldConfig": { "defaults": { "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2 }, "unit": "bytes" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 72 },
          "id": 410,
          "options": { "legend": { "displayMode": "table", "placement": "right", "showLegend": true }, "tooltip": { "mode": "multi" } },
          "targets": [
            { "expr": "sum(rate(juicefs_object_request_data_bytes{method=\"GET\"}[5m])) by (node, vol_name) / sum(rate(juicefs_object_request_durations_histogram_seconds_count{method=\"GET\"}[5m])) by (node, vol_name)", "legendFormat": "{{node}} ({{vol_name}}) avg GET size", "refId": "A" },
            { "expr": "sum(rate(juicefs_object_request_data_bytes{method=\"PUT\"}[5m])) by (node, vol_name) / sum(rate(juicefs_object_request_durations_histogram_seconds_count{method=\"PUT\"}[5m])) by (node, vol_name)", "legendFormat": "{{node}} ({{vol_name}}) avg PUT size", "refId": "B" }
          ],
          "title": "Average Object Request Size by Node (block-size cache-bypass check)",
          "type": "timeseries"
        },
        {
          "datasource": null,
          "description": "A high GET count with small average size points to many small/partial reads re-fetching recently-written blocks, rather than one big re-transfer.",
          "fieldConfig": { "defaults": { "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2 }, "unit": "reqps" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 72 },
          "id": 411,
          "options": { "legend": { "displayMode": "table", "placement": "right", "showLegend": true }, "tooltip": { "mode": "multi" } },
          "targets": [
            { "expr": "sum(rate(juicefs_object_request_durations_histogram_seconds_count{method=\"GET\"}[5m])) by (node, vol_name)", "legendFormat": "{{node}} ({{vol_name}}) GET/s", "refId": "A" },
            { "expr": "sum(rate(juicefs_object_request_durations_histogram_seconds_count{method=\"PUT\"}[5m])) by (node, vol_name)", "legendFormat": "{{node}} ({{vol_name}}) PUT/s", "refId": "B" }
          ],
          "title": "Object Store Request Count by Method and Node",
          "type": "timeseries"
        },
        {
          "datasource": null,
