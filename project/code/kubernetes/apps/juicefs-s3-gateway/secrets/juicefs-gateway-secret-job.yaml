---
# Builds the juicefs-secret Secret that the juicefs-s3-gateway chart's
# Deployment reads via secretKeyRef (METAURL, and MINIO_ROOT_USER/PASSWORD
# from the access-key/secret-key fields. See README.md for why those two
# purposes share one field). Simply copies apps/juicefs's already-composed
# juicefs-sc-secret verbatim, since both the CSI driver and this gateway
# connect to the exact same JuiceFS filesystem/metaurl.
#
# Runs on a schedule so that juicefs-sc-secret changes (credential rotation)
# are automatically propagated (with a delay). The kubectl apply step only
# updates the cluster's live secret if there is a change. The gateway's init
# container re-runs `juicefs format` on every pod start using whatever this
# secret currently holds, so a changed credential takes effect on the
# gateway's next restart (see apps/juicefs-s3-gateway/README.md's "Why no
# Reloader integration").
apiVersion: v1
kind: ServiceAccount
metadata:
  name: juicefs-gateway-secret-builder
  namespace: juicefs
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: juicefs-gateway-secret-builder
  namespace: juicefs
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["juicefs-sc-secret"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["juicefs-secret"]
    verbs: ["get", "patch"]
  # can't scope 'create' to a resourceName since the resource doesn't exist
  # yet to reference by name
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: juicefs-gateway-secret-builder
  namespace: juicefs
subjects:
  - kind: ServiceAccount
    name: juicefs-gateway-secret-builder
    namespace: juicefs
roleRef:
  kind: Role
  name: juicefs-gateway-secret-builder
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: juicefs-gateway-secret-builder
  namespace: juicefs
spec:
  # changes to juicefs-sc-secret will be detected within 15 minutes
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 6
      template:
        spec:
          serviceAccountName: juicefs-gateway-secret-builder
          restartPolicy: Never
          containers:
            - name: build-gateway-secret
              image: bitnami/kubectl:latest
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -euo pipefail

                  name="$(kubectl get secret juicefs-sc-secret -o jsonpath='{.data.name}' | base64 -d)"
                  metaurl="$(kubectl get secret juicefs-sc-secret -o jsonpath='{.data.metaurl}' | base64 -d)"
                  storage="$(kubectl get secret juicefs-sc-secret -o jsonpath='{.data.storage}' | base64 -d)"
                  access_key="$(kubectl get secret juicefs-sc-secret -o jsonpath='{.data.access-key}' | base64 -d)"
                  secret_key="$(kubectl get secret juicefs-sc-secret -o jsonpath='{.data.secret-key}' | base64 -d)"
                  bucket="$(kubectl get secret juicefs-sc-secret -o jsonpath='{.data.bucket}' | base64 -d)"

                  kubectl create secret generic juicefs-secret \
                    --from-literal=name="${name}" \
                    --from-literal=metaurl="${metaurl}" \
                    --from-literal=storage="${storage}" \
                    --from-literal=access-key="${access_key}" \
                    --from-literal=secret-key="${secret_key}" \
                    --from-literal=bucket="${bucket}" \
                    --dry-run=client -o yaml | kubectl apply -f -
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                runAsNonRoot: true
