---
# Builds the juicefs-secret Secret that the gateway's DaemonSet reads via
# secretKeyRef (METAURL, and MINIO_ROOT_USER/PASSWORD from the
# access-key/secret-key fields. See README.md for why those two purposes
# share one field). Combines the generated SeaweedFS S3 identity
# (apps/secrets/generated/juicefs-s3-credentials.yaml) and the generated
# Postgres role password (apps/postgresql/juicefs-database.yaml), both
# reflected into this namespace, into the single Secret the gateway expects.
#
# Runs on a schedule so that changes to the underlying S3/Postgres
# credentials are automatically propagated (with a delay). The kubectl apply
# step only updates the cluster's live secret if there is a change. The
# gateway's init container re-runs `juicefs format` on every pod start using
# whatever this secret currently holds, so a changed credential takes effect
# on the gateway's next restart. The reloader.stakater.com/auto annotation
# on the DaemonSet triggers reload automatically.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: juicefs-gateway-secret-builder
  namespace: juicefs
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: juicefs-gateway-secret-builder-read
  namespace: juicefs
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["juicefs-s3-credentials", "juicefs-postgres-credentials"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: juicefs-gateway-secret-builder-read
  namespace: juicefs
subjects:
  - kind: ServiceAccount
    name: juicefs-gateway-secret-builder
    namespace: juicefs
roleRef:
  kind: Role
  name: juicefs-gateway-secret-builder-read
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: juicefs-gateway-secret-builder-write
  namespace: juicefs
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["juicefs-secret"]
    verbs: ["get", "patch"]
  # can't scope 'create' to a resourceName since the resource doesn't exist
  # yet to reference by name
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: juicefs-gateway-secret-builder-write
  namespace: juicefs
subjects:
  - kind: ServiceAccount
    name: juicefs-gateway-secret-builder
    namespace: juicefs
roleRef:
  kind: Role
  name: juicefs-gateway-secret-builder-write
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: juicefs-gateway-secret-builder
  namespace: juicefs
spec:
  # changes to the underlying S3/Postgres credentials will be detected
  # within 15 minutes
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 6
      template:
        spec:
          serviceAccountName: juicefs-gateway-secret-builder
          restartPolicy: Never
          containers:
            - name: build-gateway-secret
              image: bitnami/kubectl:latest
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -euo pipefail

                  access_key="$(kubectl get secret juicefs-s3-credentials -o jsonpath='{.data.AWS_ACCESS_KEY_ID}' | base64 -d)"
                  secret_key="$(kubectl get secret juicefs-s3-credentials -o jsonpath='{.data.AWS_SECRET_ACCESS_KEY}' | base64 -d)"

                  # hex-encoded (see apps/postgresql/juicefs-database.yaml), so
                  # it's safe to interpolate directly into the connection URL
                  pg_user="$(kubectl get secret juicefs-postgres-credentials -o jsonpath='{.data.username}' | base64 -d)"
                  pg_password="$(kubectl get secret juicefs-postgres-credentials -o jsonpath='{.data.password}' | base64 -d)"

                  # sslmode=disable: cluster-internal traffic only, and the
                  # "postgres" Cluster (apps/postgresql) doesn't distribute
                  # client TLS certs outside its own namespace
                  metaurl="postgres://${pg_user}:${pg_password}@postgres-rw.postgresql.svc.cluster.local:5432/juicefs?sslmode=disable"
                  bucket="http://seaweedfs-all-in-one.seaweedfs.svc.cluster.local:9000/juicefs"

                  kubectl create secret generic juicefs-secret \
                    --from-literal=name=juicefs \
                    --from-literal=metaurl="${metaurl}" \
                    --from-literal=storage=s3 \
                    --from-literal=access-key="${access_key}" \
                    --from-literal=secret-key="${secret_key}" \
                    --from-literal=bucket="${bucket}" \
                    --dry-run=client -o yaml | kubectl apply -f -
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                runAsNonRoot: true
