---
# Bootstraps the per-app IAM users on top of the JuiceFS S3 Gateway's
# superuser (MINIO_ROOT_USER/PASSWORD, from juicefs-secret - see
# juicefs-gateway-secret-job.yaml), using the gateway's mc admin API
# (available since JuiceFS v1.2, see README.md). This gives kleinkram the
# same kind of bucket-scoped credential separation it previously had via
# SeaweedFS's identity JSON (apps/seaweedfs/secrets/seaweedfs-s3-config-job.yaml),
# instead of handing out the gateway's own root credential.
#
# Also creates the data/dbdumps/action-artifacts "buckets" (top-level
# directories, since values.yaml sets options: --multi-buckets) that those
# users need to exist before kleinkram can use them.
#
# Runs on a schedule so that new/rotated credentials in
# apps/secrets/generated/kleinkram-juicefs-credentials.yaml and
# kleinkram-juicefs-artifacts-credentials.yaml are automatically picked up
# (within 15 minutes). mc admin user add/policy set are idempotent, so
# re-running with unchanged credentials is a no-op.
#
# To add another app's identity: add a generated credentials Secret under
# apps/secrets/generated/, reflect it into this (juicefs) namespace, add its
# name to the Role's resourceNames list below, add its secret to the CronJob 
# under both spec.jobTemplate.spec.template.spec.containers.volumeMounts and
# spec.jobTemplate.spec.template.spec.volumes, and add the permissions you
# want configured in the script under data.run.sh in the ConfigMap
apiVersion: v1
kind: ServiceAccount
metadata:
  name: juicefs-gateway-iam-builder
  namespace: juicefs
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: juicefs-gateway-iam-builder
  namespace: juicefs
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - juicefs-secret
      - kleinkram-juicefs-credentials
      - kleinkram-juicefs-artifacts-credentials
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: juicefs-gateway-iam-builder
  namespace: juicefs
subjects:
  - kind: ServiceAccount
    name: juicefs-gateway-iam-builder
    namespace: juicefs
roleRef:
  kind: Role
  name: juicefs-gateway-iam-builder
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: juicefs-gateway-iam-builder-script
  namespace: juicefs
data:
  run.sh: |
    #!/bin/sh
    set -eu

    # Uses the image built from apps/juicefs-s3-gateway/Dockerfile (see 
    # apps/juicefs-s3-gateway/mc-image/README.md for details)
    root_user="$(cat /secrets/root/access-key)"
    root_password="$(cat /secrets/root/secret-key)"

    mc alias set myjfs http://juicefs-s3-gateway.juicefs.svc.cluster.local:9000 "${root_user}" "${root_password}"

    # Buckets are top-level directories under --multi-buckets. One line per
    # kleinkram bucket this gateway backs.
    for bucket in data dbdumps action-artifacts; do
      mc mb --ignore-existing "myjfs/${bucket}"
    done

    # kleinkram's main backend: readwrite on every bucket (mirrors the
    # unscoped Admin,Read,Write,List,Tagging access kleinkram-backend has in
    # apps/seaweedfs/secrets/seaweedfs-s3-config-job.yaml)
    backend_access="$(cat /secrets/backend/AWS_ACCESS_KEY_ID)"
    backend_secret="$(cat /secrets/backend/AWS_SECRET_ACCESS_KEY)"
    mc admin user add myjfs "${backend_access}" "${backend_secret}"
    mc admin policy set myjfs readwrite user="${backend_access}"

    # kleinkram's Argo artifact repository: scoped to action-artifacts only
    # (mirrors kleinkram-artifacts's bucket-scoped access in the same
    # SeaweedFS config job)
    cat > /tmp/kleinkram-artifacts-only.json <<'EOF'
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": ["s3:*"],
          "Resource": [
            "arn:aws:s3:::action-artifacts",
            "arn:aws:s3:::action-artifacts/*"
          ]
        }
      ]
    }
    EOF
    mc admin policy add myjfs kleinkram-artifacts-only /tmp/kleinkram-artifacts-only.json

    artifacts_access="$(cat /secrets/artifacts/AWS_ACCESS_KEY_ID)"
    artifacts_secret="$(cat /secrets/artifacts/AWS_SECRET_ACCESS_KEY)"
    mc admin user add myjfs "${artifacts_access}" "${artifacts_secret}"
    mc admin policy set myjfs kleinkram-artifacts-only user="${artifacts_access}"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: juicefs-gateway-iam-builder
  namespace: juicefs
spec:
  # new/rotated credentials will be detected within 15 minutes
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 6
      template:
        spec:
          serviceAccountName: juicefs-gateway-iam-builder
          restartPolicy: Never
          imagePullSecrets:
            - name: zot-pull-secret
          containers:
            - name: build-gateway-iam
              image: registry.direct.merrickcampbell.au/mc-juicefs:2021-04-22
              command: ["/bin/sh", "/scripts/run.sh"]
              env:
                - name: HOME
                  value: /tmp
              volumeMounts:
                - name: script
                  mountPath: /scripts
                - name: root-creds
                  mountPath: /secrets/root
                  readOnly: true
                - name: backend-creds
                  mountPath: /secrets/backend
                  readOnly: true
                - name: artifacts-creds
                  mountPath: /secrets/artifacts
                  readOnly: true
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                runAsNonRoot: true
                runAsUser: 1000
          volumes:
            - name: script
              configMap:
                name: juicefs-gateway-iam-builder-script
                defaultMode: 0555
            - name: root-creds
              secret:
                secretName: juicefs-secret
            - name: backend-creds
              secret:
                secretName: kleinkram-juicefs-credentials
            - name: artifacts-creds
              secret:
                secretName: kleinkram-juicefs-artifacts-credentials
