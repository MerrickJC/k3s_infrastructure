apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kleinkram-route
  namespace: kleinkram
spec:
  entryPoints:
    - web         # TODO: change to websecure when you need TLS encryption
  routes:
    - match: Host(`kleinkram.merrickcampbell.au`)
      kind: Rule
      services:
        - name: kleinkram-frontend
          port: 80
    - match: Host(`kleinkram-docs.merrickcampbell.au`)
      kind: Rule
      services:
        - name: kleinkram-documentation
          port: 80
    - match: Host(`kleinkram-api.merrickcampbell.au`)
      kind: Rule
      services:
        - name: kleinkram-api-server
          port: 3000

  ## TODO: Uncomment when you need TLS encryption (e.g. when access directly and not through cloudflare tunnel)
  # tls:
  #   secretName: kleinkram-tls
