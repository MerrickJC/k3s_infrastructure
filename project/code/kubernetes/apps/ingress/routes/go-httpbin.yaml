apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: go-httpbin-route
  namespace: go-httpbin
spec:
  entryPoints:
    - web         # TODO: change to websecure when you need TLS encryption
  routes:
    - match: Host(`go-httpbin.merrickcampbell.au`)
      kind: Rule
      services:
        - name: go-httpbin
          port: 80

  ## TODO: Uncomment when you need TLS encryption (e.g. when access directly and not through cloudflare tunnel)
  # tls:
  #   secretName: go-httpbin-tls
