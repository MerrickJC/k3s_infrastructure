apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kueueviz-route
  namespace: kueue-system
spec:
  entryPoints:
    - web         # TODO: change to websecure when you need TLS encryption
  routes:
    # Paths the frontend calls directly (WebSocket updates, REST API, auth probe) must reach the
    # backend; matched first since Traefik would otherwise fall through to the frontend's `/`.
    - match: Host(`kueueviz.merrickcampbell.au`) && (PathPrefix(`/ws`) || PathPrefix(`/api`) || PathPrefix(`/auth`))
      kind: Rule
      services:
        - name: kueue-kueueviz-backend
          port: 8080
    - match: Host(`kueueviz.merrickcampbell.au`)
      kind: Rule
      services:
        - name: kueue-kueueviz-frontend
          port: 8080

  ## TODO: Uncomment when you need TLS encryption (e.g. when access directly and not through cloudflare tunnel)
  # tls:
  #   secretName: kueueviz-tls
