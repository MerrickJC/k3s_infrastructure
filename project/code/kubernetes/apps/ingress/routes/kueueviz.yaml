# This file is the reference example for protecting an app with the shared apps/oauth2-proxy
# SSO gateway -- see apps/oauth2-proxy/README.md for the full "protect a new app" runbook.
# Everything below except the IngressRoute's own backend/frontend service names is a
# copy-paste template: only `metadata.namespace` and the Host in `match` need to change per app.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: kueueviz-oauth2-auth
  namespace: kueue-system
spec:
  forwardAuth:
    # Raw address, not a Service reference since Traefik calls this directly, so no
    # cross-namespace restriction applies here regardless of namespace. Identical for every
    # protected app since oauth2-proxy is one shared instance.
    address: http://oauth2-proxy.oauth2-proxy.svc.cluster.local/oauth2/auth
    trustForwardHeader: true
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
    # Without this, an unauthenticated request just gets a bare 401 from oauth2-proxy's
    # /oauth2/auth check. With it, Traefik turns that 401 into a real redirect to the login
    # flow for browser-facing requests.
    authSigninURL: /oauth2/start
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kueueviz-route
  namespace: kueue-system
spec:
  entryPoints:
    - web         # TODO: change to websecure when you need TLS encryption
  routes:
    # oauth2-proxy's own endpoints (login redirect, callback, sign-out) must bypass the auth
    # middleware below entirely, otherwise login could never complete. Every protected app
    # needs this same route, with its own Host. Cross-namespace service reference requires
    # providers.kubernetesCRD.allowCrossNamespace (apps/traefik/manifest.yaml).
    - match: Host(`kueueviz.merrickcampbell.au`) && PathPrefix(`/oauth2`)
      kind: Rule
      services:
        - name: oauth2-proxy
          namespace: oauth2-proxy
          port: 80
    # Paths the frontend calls directly (WebSocket updates, REST API, auth probe) must reach
    # the backend; matched before the frontend's catch-all `/`. The forwardAuth middleware
    # relies on the browser sending oauth2-proxy's session cookie, which it does automatically
    # since these are all same-origin requests.
    - match: Host(`kueueviz.merrickcampbell.au`) && (PathPrefix(`/ws`) || PathPrefix(`/api`) || PathPrefix(`/auth`))
      kind: Rule
      middlewares:
        - name: kueueviz-oauth2-auth
      services:
        - name: kueue-kueueviz-backend
          port: 8080
    - match: Host(`kueueviz.merrickcampbell.au`)
      kind: Rule
      middlewares:
        - name: kueueviz-oauth2-auth
      services:
        - name: kueue-kueueviz-frontend
          port: 8080

  ## TODO: Uncomment when you need TLS encryption (e.g. when access directly and not through cloudflare tunnel)
  # tls:
  #   secretName: kueueviz-tls
