apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: zot-route
  namespace: zot
spec:
  entryPoints:
    - web         # TODO: change to websecure when you need TLS encryption
  routes:
    - match: Host(`registry.merrickcampbell.au`)
      kind: Rule
      services:
        - name: zot
          port: 5000

  ## TODO: Uncomment when you need TLS encryption (e.g. when access directly and not through cloudflare tunnel)
  # tls:
  #   secretName: zot-tls
