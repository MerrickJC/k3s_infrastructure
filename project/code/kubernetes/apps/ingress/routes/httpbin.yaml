apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: httpbin-route
  namespace: httpbin
spec:
  entryPoints:
    - web         # TODO: change to websecure when you need TLS encryption
  routes:
    - match: Host(`httpbin.merrickcampbell.au`)
      kind: Rule
      services:
        - name: httpbin-service
          port: 80

  ## TODO: Uncomment when you need TLS encryption (e.g. when access directly and not through cloudflare tunnel)
  # tls:
  #   secretName: httpbin-tls
