# Reuse the cert-manager already deployed in this cluster (apps/cert-manager) for Kueue's webhook
# certs instead of the chart's default self-signed-cert Job
enableCertManager: true

# Argo Workflow pods are raw Pods, not batch/Job -- Kueue only intercepts them if the "pod" integration
# framework is enabled
managerConfig:
  controllerManagerConfigYaml: |
    apiVersion: config.kueue.x-k8s.io/v1beta1
    kind: Configuration
    integrations:
      frameworks:
        - pod
    waitForPodsReady:
      enable: false
