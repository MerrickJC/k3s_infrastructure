apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
    # DNS-01 via Cloudflare for merrickcampbell.au
    - selector:
        dnsZones:
          - merrickcampbell.au
      dns01:
        cloudflare:
          apiTokenSecretRef:
            name: cloudflare-api-token
            key: api-token
    # Fallback for any domain outside the Cloudflare zone above.
    - http01:
        ingress:
          ingressClassName: traefik
