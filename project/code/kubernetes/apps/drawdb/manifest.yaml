apiVersion: apps/v1
kind: Deployment
metadata:
  name: drawdb
  labels:
    app: drawdb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: drawdb
  template:
    metadata:
      labels:
        app: drawdb
    spec:
      containers:
      - name: drawdb
        image: ghcr.io/drawdb-io/drawdb:latest
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: drawdb-service
spec:
  type: ClusterIP
  selector:
    app: drawdb
  ports:
  - port: 80
    targetPort: 3000
