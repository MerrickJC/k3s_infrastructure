# Job DSL scripts, one file per team folder. This ConfigMap is the single source of truth for
# these scripts (there are no separate .groovy files elsewhere to keep in sync).
# volumes/mounts in values.yaml mounts it onto the Jenkins controller at /var/jenkins_home/job-dsl,
# and the seed job (see the `jobs:` block in values.yaml's JCasC config) runs `jobDsl` against the
# mounted *.groovy files to (re)create the folders/jobs below. See docs/kubernetes/jenkins-jobs.md
# for how to add a new team folder or repository.
#
# Keys must be valid Groovy script/class identifiers (letters, digits, underscores only, no
# leading digit) - Job DSL compiles each mounted file as a Groovy class named after its filename
# (minus .groovy), so a hyphen (e.g. "autonomous-systems.groovy") fails with "invalid script name"
# even though it's a perfectly normal ConfigMap key / filename otherwise. Use underscores instead.
#
# Branch sources use configure{} raw XML, not the built-in branchSources { github { ... } } DSL:
# that shorthand (javaposse.jobdsl.dsl.helpers.workflow.GitHubBranchSourceContext, bundled in
# job-dsl-plugin itself since ~2015/v1.54) predates github-branch-source-plugin's traits system
# entirely and only exposes 6 boolean toggles - no traits{}, no fork-PR trust control. The XML
# below is copied verbatim from each job's original config.xml (from the old Jenkins instance),
# with only the credentialsId normalized to this instance's real credential ID. See
# docs/kubernetes/jenkins-jobs.md for the full explanation.
#
apiVersion: v1
kind: ConfigMap
metadata:
  name: jenkins-job-dsl
  namespace: jenkins
data:
  autonomous_systems.groovy: |
    folder('Autonomous Systems') {
        description('Folder for all Autonomous Systems repositories/projects')
    }

    multibranchPipelineJob('Autonomous Systems/mms_ws2') {
        description('Pipeline 2')

        configure { Node project ->
            project.remove(project / 'sources')
            project << new XmlParser().parseText('''
                <sources class="jenkins.branch.MultiBranchProject$BranchSourceList">
                  <data>
                    <jenkins.branch.BranchSource>
                      <source class="org.jenkinsci.plugins.github_branch_source.GitHubSCMSource">
                        <id>1</id>
                        <apiUri>https://api.github.com</apiUri>
                        <credentialsId>jenkins-api-key-for-github</credentialsId>
                        <repoOwner>monashmotorsport</repoOwner>
                        <repository>mms_ws2</repository>
                        <repositoryUrl>https://github.com/monashmotorsport/mms_ws2.git</repositoryUrl>
                        <traits>
                          <org.jenkinsci.plugins.github__branch__source.BranchDiscoveryTrait>
                            <strategyId>3</strategyId>
                          </org.jenkinsci.plugins.github__branch__source.BranchDiscoveryTrait>
                          <org.jenkinsci.plugins.github__branch__source.OriginPullRequestDiscoveryTrait>
                            <strategyId>2</strategyId>
                          </org.jenkinsci.plugins.github__branch__source.OriginPullRequestDiscoveryTrait>
                          <org.jenkinsci.plugins.github__branch__source.ForkPullRequestDiscoveryTrait>
                            <strategyId>2</strategyId>
                            <trust class="org.jenkinsci.plugins.github_branch_source.ForkPullRequestDiscoveryTrait$TrustPermission"/>
                          </org.jenkinsci.plugins.github__branch__source.ForkPullRequestDiscoveryTrait>
                        </traits>
                      </source>
                      <strategy class="jenkins.branch.DefaultBranchPropertyStrategy">
                        <properties class="java.util.Arrays$ArrayList">
                          <a class="jenkins.branch.BranchProperty-array">
                            <jenkins.branch.NoTriggerBranchProperty>
                              <triggeredBranchesRegex>^(master|PR-\\d+)$</triggeredBranchesRegex>
                              <strategy>INDEXING</strategy>
                            </jenkins.branch.NoTriggerBranchProperty>
                          </a>
                        </properties>
                      </strategy>
                    </jenkins.branch.BranchSource>
                  </data>
                </sources>
                ''')

            project.remove(project / 'factory')
            project << new XmlParser().parseText('''
                <factory class="org.jenkinsci.plugins.workflow.multibranch.WorkflowBranchProjectFactory">
                  <scriptPath>Jenkinsfile</scriptPath>
                </factory>
                ''')

            // Re-scan every 24 hours for new/removed branches and PRs (master/PR branches build via
            // their own event triggers elsewhere, not this scan - see the NoTriggerBranchProperty
            // above).
            //
            // spec and interval must agree: Jenkins normally derives spec FROM interval
            // (toCrontab(interval)) when set via the UI, and PeriodicFolderTrigger.run() gates
            // actual rescans on interval (ms) elapsed, not on spec - spec only controls how often
            // Jenkins checks whether it's time to run. A mismatched pair (e.g. a 4-hour spec next
            // to a 24-hour interval) silently rescans on the interval's cadence, not the spec's.
            project.remove(project / 'triggers')
            project << new XmlParser().parseText('''
                <triggers>
                  <com.cloudbees.hudson.plugins.folder.computed.PeriodicFolderTrigger>
                    <spec>H H * * *</spec>
                    <interval>86400000</interval>
                  </com.cloudbees.hudson.plugins.folder.computed.PeriodicFolderTrigger>
                </triggers>
                ''')
        }
    }
  dynamics.groovy: |
    folder('Dynamics') {
        description('This folder is for any VP related repositories')
    }

    multibranchPipelineJob('Dynamics/m26_m150_firmware') {
        description('This repository contains all the MoTeC software relevant to M26')

        configure { Node project ->
            project.remove(project / 'sources')
            project << new XmlParser().parseText('''
                <sources class="jenkins.branch.MultiBranchProject$BranchSourceList">
                  <data>
                    <jenkins.branch.BranchSource>
                      <source class="org.jenkinsci.plugins.github_branch_source.GitHubSCMSource">
                        <id>1</id>
                        <apiUri>https://api.github.com</apiUri>
                        <credentialsId>jenkins-api-key-for-github</credentialsId>
                        <repoOwner>monashmotorsport</repoOwner>
                        <repository>m26_m150_firmware</repository>
                        <repositoryUrl>https://github.com/monashmotorsport/m26_m150_firmware.git</repositoryUrl>
                        <traits>
                          <org.jenkinsci.plugins.github__branch__source.BranchDiscoveryTrait>
                            <strategyId>1</strategyId>
                          </org.jenkinsci.plugins.github__branch__source.BranchDiscoveryTrait>
                          <org.jenkinsci.plugins.github__branch__source.OriginPullRequestDiscoveryTrait>
                            <strategyId>2</strategyId>
                          </org.jenkinsci.plugins.github__branch__source.OriginPullRequestDiscoveryTrait>
                          <org.jenkinsci.plugins.github__branch__source.ForkPullRequestDiscoveryTrait>
                            <strategyId>2</strategyId>
                            <trust class="org.jenkinsci.plugins.github_branch_source.ForkPullRequestDiscoveryTrait$TrustPermission"/>
                          </org.jenkinsci.plugins.github__branch__source.ForkPullRequestDiscoveryTrait>
                        </traits>
                      </source>
                      <strategy class="jenkins.branch.DefaultBranchPropertyStrategy">
                        <properties class="empty-list"/>
                      </strategy>
                    </jenkins.branch.BranchSource>
                  </data>
                </sources>
                ''')

            project.remove(project / 'factory')
            project << new XmlParser().parseText('''
                <factory class="org.jenkinsci.plugins.workflow.multibranch.WorkflowBranchProjectFactory">
                  <scriptPath>Jenkinsfile</scriptPath>
                </factory>
                ''')
        }
    }
  electrical_systems.groovy: |
    folder('Electrical Systems (ESYS)') {
        description('Folder for all Electrical Systems (ESYS) projects/repositories')
    }

    multibranchPipelineJob('Electrical Systems (ESYS)/2025-2026-BMS-Firmware') {
        description("This repository is for ESYS' BMS software for their Battery Management System.")

        configure { Node project ->
            project.remove(project / 'sources')
            project << new XmlParser().parseText('''
                <sources class="jenkins.branch.MultiBranchProject$BranchSourceList">
                  <data>
                    <jenkins.branch.BranchSource>
                      <source class="org.jenkinsci.plugins.github_branch_source.GitHubSCMSource">
                        <id>1</id>
                        <apiUri>https://api.github.com</apiUri>
                        <credentialsId>jenkins-api-key-for-github</credentialsId>
                        <repoOwner>monashmotorsport</repoOwner>
                        <repository>2025-2026-BMS-Firmware</repository>
                        <repositoryUrl>https://github.com/monashmotorsport/2025-2026-BMS-Firmware.git</repositoryUrl>
                        <traits>
                          <org.jenkinsci.plugins.github__branch__source.BranchDiscoveryTrait>
                            <strategyId>1</strategyId>
                          </org.jenkinsci.plugins.github__branch__source.BranchDiscoveryTrait>
                          <org.jenkinsci.plugins.github__branch__source.OriginPullRequestDiscoveryTrait>
                            <strategyId>2</strategyId>
                          </org.jenkinsci.plugins.github__branch__source.OriginPullRequestDiscoveryTrait>
                          <org.jenkinsci.plugins.github__branch__source.ForkPullRequestDiscoveryTrait>
                            <strategyId>2</strategyId>
                            <trust class="org.jenkinsci.plugins.github_branch_source.ForkPullRequestDiscoveryTrait$TrustPermission"/>
                          </org.jenkinsci.plugins.github__branch__source.ForkPullRequestDiscoveryTrait>
                        </traits>
                      </source>
                      <strategy class="jenkins.branch.DefaultBranchPropertyStrategy">
                        <properties class="empty-list"/>
                      </strategy>
                    </jenkins.branch.BranchSource>
                  </data>
                </sources>
                ''')

            project.remove(project / 'factory')
            project << new XmlParser().parseText('''
                <factory class="org.jenkinsci.plugins.workflow.multibranch.WorkflowBranchProjectFactory">
                  <scriptPath>Jenkinsfile</scriptPath>
                </factory>
                ''')
        }
    }
