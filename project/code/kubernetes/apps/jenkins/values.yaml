# Wires the Jenkins Configuration as Code (JCasC) config into the Helm chart via
# controller.JCasC.configScripts below.
#
# The ${...} placeholders in the config are resolved by JCasC's built-in environment
# variable substitution, using the env vars injected below via containerEnv. The actual
# secret values live in SealedSecrets
controller:
  # The chart auto-generates its own default JCasC config from these controller.* values
  # (see templates/_helpers.tpl's "jenkins.casc.defaults") in ADDITION to configScripts below -
  # both are separate YAML sources merged by JCasC, and JCasC errors on any key both sources
  # define, even if the values are identical (ConfiguratorConflictException, fails the whole
  # boot). numExecutors and jenkinsUrl are set here because they differ from the chart's
  # defaults (0 and an internal-only URL respectively)
  numExecutors: 3
  jenkinsUrl: "https://jenkins.merrickcampbell.au/"
  # Additive to the chart's default controller.installPlugins (kubernetes, workflow-aggregator,
  # git, configuration-as-code) - do NOT set installPlugins directly here, it replaces that list
  # wholesale rather than merging, which would silently drop configuration-as-code and break JCasC.
  # Each entry below was verified against the update center's dependency graph as NOT already
  # transitively pulled in by another plugin here, and mapped from a specific JCasC key in the
  # config below
  additionalPlugins:
    - oic-auth:4.718.ve731df6ca_88a_
    # gitHubApp credential type
    - github-branch-source:1983.vfa_27ed961853
    # jenkins.authorizationStrategy.globalMatrix
    - matrix-auth:3.3
    # unclassified.email-ext
    - email-ext:2038.v7b_8817a_499d9
    # appearance.pipelineGraphView
    - pipeline-graph-view:1013.v9f83fd83c063
    # appearance.coverage
    - code-coverage-api:4.99.0
    # unclassified.timestamper
    - timestamper:1.30
    # unclassified.junitTestResultStorage
    - junit:1421.v99cb_b_2577709
    # unclassified.googlechatnotification (used by the Pull Request Status webhook credential)
    - google-chat-notification:166.ve6b_de280f2e8
    # unclassified.pipeline-model-docker
    - docker-workflow:653.v2f2c08eff0ec
    # appearance.themeManager - found by the boot-validation CI check, not by inference
    # this time (jenkins.appearance.AppearanceCategory rejected it as an unknown attribute)
    - theme-manager:346.v06cca_64c6a_37
    # security.sSHD - also found by the boot-validation check
    - sshd:3.384.vc89b_5e138cf9
    # unclassified.globalTimeOutConfiguration and unclassified.buildStepOperation - both
    # from hudson.plugins.build_timeout.operations.BuildStepOperation in this one plugin
    - build-timeout:1.41
    # unclassified.injectionConfig and unclassified.enrichedSummaryConfig - Develocity/Gradle
    # Enterprise build-scan auto-injection and detection features
    - gradle:2.19.1252.v15196b_5a_6e10
    # jobs (the seed job below) - Job DSL engine that turns the mounted *.groovy scripts into
    # actual folder/multibranch-pipeline job objects
    - job-dsl:3732.v9a_c49a_61a_313
  JCasC:
    configScripts:
      jenkins-config: |
        configuration-as-code:
          deprecated: "reject"
          restricted: "reject"
          unknown: "reject"
          version: "1"
        credentials:
          folder: {
            }
          providerImpl: {
            }
          system:
            domainCredentials:
            - credentials:
              - gitHubApp:
                  appID: "4633594"
                  description: "GitHub App for Jenkins access to github repositories, etc."
                  id: "jenkins-api-key-for-github"
                  privateKey: "${JENKINS_GITHUB_TOKEN}"
              - string:
                  description: "Webhook for the Pull Request Status space"
                  id: "jenkins-google-chat-pull-request-status"
                  scope: GLOBAL
                  secret: "${JENKINS_GOOGLE_CHAT_SECRET}"
              domain: {
                }
          user: {
            }
        jenkins:
          authorizationStrategy:
            globalMatrix:
              entries:
              - group:
                  name: "monashmotorsport"
                  permissions:
                  - "Overall/Manage"
                  - "Overall/Read"
              - group:
                  name: "monashmotorsport:autonomous-systems"
                  permissions:
                  - "Overall/Administer"
          crumbIssuer: "standard"
          labelAtoms:
          - name: "built-in"
          - name: "jenkins-agent"
          log: {
            }
          nodeMonitors:
          - "architecture"
          - "clock"
          - diskSpace:
              freeSpaceThreshold: "1GiB"
              freeSpaceWarningThreshold: "2GiB"
          - "swapSpace"
          - tmpSpace:
              freeSpaceThreshold: "1GiB"
              freeSpaceWarningThreshold: "2GiB"
          - "responseTime"
          primaryView:
            all:
              name: "all"
          quietPeriod: 5
          remotingSecurity:
            enabled: true
          scmCheckoutRetryCount: 0
          securityRealm:
            oic:
              clientId: "jenkins"
              clientSecret: "${JENKINS_DEX_CLIENT_SECRET}"
              serverConfiguration:
                wellKnown:
                  wellKnownOpenIDConfigurationUrl: "https://dex.merrickcampbell.au/.well-known/openid-configuration"
                  scopesOverride: "openid email profile groups"
              userNameField: "email"
              emailFieldName: "email"
              fullNameFieldName: "name"
              groupsFieldName: "groups"
              logoutFromOpenidProvider: true
          updateCenter:
            sites:
            - id: "default"
              url: "https://updates.jenkins.io/update-center.json"
          views:
          - all:
              name: "all"
          viewsTabBar: "standard"
        globalCredentialsConfiguration:
          configuration:
            providerFilter: "none"
            typeFilter: "none"
        # Seed job: (re)provisions every other job from the Job DSL scripts in the
        # jenkins-job-dsl ConfigMap (see job-dsl-configmap.yaml in this folder), which
        # persistence.volumes/mounts below mount onto this controller at /var/jenkins_home/job-dsl.
        # This is the one job NOT defined via Job DSL itself (a seed job can't create itself) -
        # JCasC's jobs: block is how it's still defined as code rather than clicked together once.
        # removedJobAction is DISABLE (not DELETE) deliberately: per docs/kubernetes/jenkins-jobs.md
        jobs:
        - script: |
            pipelineJob('seed-job') {
                description('Provisions all other Jenkins jobs from the Job DSL scripts mounted at /var/jenkins_home/job-dsl. Source: project/code/kubernetes/apps/jenkins/job-dsl-configmap.yaml in the GitOps repo. Run manually (Build Now) - not scheduled or webhook-triggered yet.')
                definition {
                    cps {
                        script('''
                            pipeline {
                                agent any
                                stages {
                                    stage('Run Job DSL') {
                                        steps {
                                            // Scripts come straight from the mounted ConfigMap for now - no
                                            // separate DSL repo/checkout step needed yet. jobDsl's targets: is
                                            // always resolved as an Ant fileset glob relative to the current
                                            // FilePath context, which is the build workspace by default and
                                            // rejects a leading '/' - dir() repoints that context at the mount
                                            // path so a plain relative glob works.
                                            //
                                            // Not sandboxed: sandbox: true was tried and rejected - it requires
                                            // a QueueItemAuthenticator (Authorize Project plugin) telling Jenkins
                                            // whose permissions to enforce during job creation, which is a real
                                            // plugin + security-identity decision this repo isn't taking on yet
                                            // (see docs/kubernetes/jenkins-jobs.md, "Script approval"). Unsandboxed
                                            // means the first run - and any run after a script's content changes -
                                            // needs a one-time admin approval under Manage Jenkins > In-process
                                            // Script Approval.
                                            dir('/var/jenkins_home/job-dsl') {
                                                jobDsl targets: '*.groovy',
                                                       removedJobAction: 'DISABLE'
                                            }
                                        }
                                    }
                                }
                            }

                            // --- Future: once the DSL scripts move into their own git repo, replace the
                            // stage above with a checkout stage plus a targets path into the checkout, e.g.:
                            //
                            // pipeline {
                            //     agent any
                            //     stages {
                            //         stage('Checkout DSL repo') {
                            //             steps {
                            //                 git url: 'https://github.com/monashmotorsport/jenkins-jobs.git',
                            //                     branch: 'main',
                            //                     credentialsId: 'jenkins-api-key-for-github'
                            //             }
                            //         }
                            //         stage('Run Job DSL') {
                            //             steps {
                            //                 jobDsl targets: 'jobs/*.groovy', removedJobAction: 'DISABLE'
                            //             }
                            //         }
                            //     }
                            // }
                        '''.stripIndent())
                        sandbox(true)
                    }
                }
            }
        appearance:
          consoleUrlProvider: {
            }
          coverage:
            defaultMetric: LINE
            defaultName: "Coverage"
            enableColumnByDefault: true
          pipelineGraphView:
            showGraphOnBuildPage: false
            showGraphOnJobPage: false
            showStageDurations: false
            showStageNames: false
          prism:
            theme: PRISM
          themeManager:
            disableUserThemes: false
            theme: "noOp"
        security:
          apiTokenProperty: {
            }
          contentSecurityPolicy:
            enforce: true
          cps:
            hideSandbox: false
          crumb: {
            }
          gitHooks:
            allowedOnAgents: false
            allowedOnController: false
          gitHostKeyVerificationConfiguration:
            sshHostKeyVerificationStrategy: "knownHostsFileVerificationStrategy"
          prism:
            protectSourceCodeByPermission: false
          queueItemAuthenticator: {
            }
          sSHD:
            port: -1
          scriptApproval:
            forceSandbox: false
          updateSiteWarningsConfiguration: {
            }
        unclassified:
          administrativeMonitorsConfiguration: {
            }
          artifactManager: {
            }
          buildDiscarders:
            configuredBuildDiscarders:
            - "jobBuildDiscarder"
          buildStepOperation:
            enabled: false
          casCGlobalConfig: {
            }
          computerRetentionCheckInterval: {
            }
          defaultDisplayUrlProvider: {
            }
          defaultFolderConfiguration: {
            }
          defaultView: {
            }
          email-ext:
            adminRequiredForTemplateTesting: false
            allowUnregisteredEnabled: false
            charset: "UTF-8"
            debugMode: false
            defaultAttachBuildLog: 0
            defaultBody: |-
              $PROJECT_NAME - Build # $BUILD_NUMBER - $BUILD_STATUS:

              Check console output at $BUILD_URL to view the results.
            defaultSubject: "$PROJECT_NAME - Build # $BUILD_NUMBER - $BUILD_STATUS!"
            defaultTriggerIds:
            - "hudson.plugins.emailext.plugins.trigger.FailureTrigger"
            mailAccount: {
              }
            maxAttachmentSize: -1
            maxAttachmentSizeMb: -1
            precedenceBulk: false
            throttlingEnabled: false
            watchingEnabled: false
          enrichedSummaryConfig:
            enrichedSummaryEnabled: false
            globalBuildScanDetection: false
            httpClientDelayBetweenRetriesInSeconds: 1
            httpClientMaxRetries: 3
            httpClientTimeoutInSeconds: 1
          envVarsFilter: {
            }
          fingerprints:
            fingerprintCleanupDisabled: false
            storage: "file"
          gitHubConfiguration:
            apiRateLimitChecker: ThrottleForNormalize
          gitHubPluginConfig:
            hookUrl: "https://jenkins.merrickcampbell.au/github-webhook/"
          globalDefaultFlowDurabilityLevel: {
            }
          globalLibraries:
            libraries:
            - name: "jenkins_libraries"
              defaultVersion: "main"
              implicit: false
              allowVersionOverride: true
              includeInChangesets: true
              retriever:
                modernSCM:
                  scm:
                    github:
                      repoOwner: "monashmotorsport"
                      repository: "jenkins_libraries"
                      credentialsId: "jenkins-api-key-for-github"
                      traits:
                      - gitHubBranchDiscovery:
                          strategyId: 1
                      - gitHubPullRequestDiscovery:
                          strategyId: 2
                      - gitHubForkDiscovery:
                          strategyId: 2
                          trust: "trustPermission"
          globalTimeOutConfiguration:
            operations:
            - "abortOperation"
            overwriteable: false
          globalUntrustedLibraries: {
            }
          googlechatnotification: {
            }
          injectionConfig:
            allowUntrusted: false
            checkForBuildAgentErrors: false
            enabled: false
            enforceUrl: false
            injectCcudExtension: false
            injectMavenExtension: false
          junitTestResultStorage:
            storage: "file"
          location:
            # TODO: set a real monitored admin address
            adminAddress: "address not configured yet <nobody@nowhere>"
          mailer:
            charset: "UTF-8"
            useSsl: false
            useTls: false
          myView: {
            }
          nodeProperties: {
            }
          pipeline-model-docker: {
            }
          plugin: {
            }
          pollSCM:
            pollingThreadCount: 10
          projectNamingStrategy: {
            }
          proxyConfigurationManager: {
            }
          quietPeriod: {
            }
          resourceRoot: {
            }
          scmGit:
            addGitTagAction: false
            allowSecondFetch: false
            createAccountBasedOnEmail: false
            disableGitToolChooser: false
            hideCredentials: false
            showEntireCommitSummaryInChanges: false
            useExistingAccountWithSameEmail: false
          scmRetryCount: {
            }
          shell: {
            }
          timestamper:
            allPipelines: false
            elapsedTimeFormat: "'<b>'HH:mm:ss.S'</b> '"
            systemTimeFormat: "'<b>'HH:mm:ss'</b> '"
          usageStatistics: {
            }
          viewsTabBar: {
            }
          # unclassified.whitelist was in the original export as {enabled: false} but couldn't
          # be confidently attributed to a specific plugin (unlike the other gaps found by the
          # boot-validation check, this one has no other fields to identify it by, and the value
          # was already the disabled/off state). Dropped rather than guess a plugin that might be
          # wrong. If Jenkins' own UI (Manage Jenkins > System) surfaces the real feature this
          # controls, re-add it with the correct plugin pinned.
        tool:
          git:
            installations:
            - home: "git"
              name: "Default"
          mavenGlobalConfig:
            globalSettingsProvider: "standard"
            settingsProvider: "standard"
  containerEnv:
    - name: JENKINS_GITHUB_TOKEN
      valueFrom:
        secretKeyRef:
          name: jenkins-github-api-token
          key: JENKINS_GITHUB_TOKEN
    - name: JENKINS_GOOGLE_CHAT_SECRET
      valueFrom:
        secretKeyRef:
          name: jenkins-google-chat-secret
          key: JENKINS_GOOGLE_CHAT_SECRET
    - name: JENKINS_DEX_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: jenkins-dex-client-secret
          key: JENKINS_DEX_CLIENT_SECRET

# agent.enabled defaults to true and controller.JCasC.defaultConfig (above) defaults to true,
# so the chart already auto-generates a Kubernetes cloud + default pod template via JCasC - no
# manual `clouds:` block needed here. But the default pod template label is
# "{{ .Release.Name }}-{{ .Values.agent.componentName }}", and agent.componentName itself
# defaults to the literal string "jenkins-agent" - with ArgoCD's Release.Name being "jenkins"
# (the Application name), that resolves to label "jenkins-jenkins-agent", NOT "jenkins-agent".
# Pipelines requesting `agent { label 'jenkins-agent' }` (see customJenkinsLabels/labelAtoms
# above) don't match that. customJenkinsLabels here is additive to the default label, so this
# makes the pod template also carry "jenkins-agent" and actually satisfy those pipelines.
agent:
  customJenkinsLabels:
    - "jenkins-agent"

# Mounts the jenkins-job-dsl ConfigMap (job-dsl-configmap.yaml, in this same folder) onto the
# controller so the seed job (see the `jobs:` block in controller.JCasC.configScripts above) can
# run `jobDsl targets: '/var/jenkins_home/job-dsl/*.groovy'` against it directly, with no git
# checkout needed yet.
persistence:
  volumes:
    - name: job-dsl
      configMap:
        name: jenkins-job-dsl
  mounts:
    - name: job-dsl
      mountPath: /var/jenkins_home/job-dsl
      readOnly: true
