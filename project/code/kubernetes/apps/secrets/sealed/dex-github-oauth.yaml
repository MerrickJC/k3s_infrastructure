# Overwrite `spec.encryptedData` in this file with the `spec.encryptedData` field in the output of the command:
#   kubectl create secret generic dex-github-oauth --from-literal=GITHUB_CLIENT_SECRET=<value> -n secrets --dry-run=client -o yaml | kubeseal --format yaml

---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: dex-github-oauth
  namespace: secrets
spec:
  encryptedData:
    GITHUB_CLIENT_SECRET: 
  template:
    metadata:
      name: dex-github-oauth
      namespace: secrets
      annotations:
        reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
        reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "dex"
        reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
    type: Opaque
