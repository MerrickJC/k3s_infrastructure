# WARNING: Fake placeholder values just to get Kleinkram to start
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: kleinkram-github-oauth-credentials
  namespace: secrets
spec:
  encryptedData:
    GITHUB_CLIENT_ID: 
    GITHUB_CLIENT_SECRET: 
  template:
    metadata:
      name: kleinkram-github-oauth-credentials
      namespace: secrets
      annotations:
        reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
        reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "kleinkram"
        reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
    type: Opaque
