# Overwrite `spec.encryptedData` in this file with the `spec.encryptedData` field in the output of the command:
#   kubectl create secret generic tunnel-token --from-literal=token=<value> -n secrets --dry-run=client -o yaml | kubeseal --format yaml

---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: tunnel-token
  namespace: secrets
spec:
  encryptedData:
    token: 
  template:
    metadata:
      name: tunnel-token
      namespace: secrets
      annotations:
        reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
        reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "cloudflare"
    type: Opaque
