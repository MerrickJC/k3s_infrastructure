# Overwrite `spec.encryptedData` in this file with the `spec.encryptedData` field in the output of the command:
#   kubectl create secret generic jenkins-google-chat-secret --from-literal=JENKINS_GOOGLE_CHAT_SECRET=<value> -n secrets --dry-run=client -o yaml | kubeseal --format yaml

# PLEASE NOTE: THE BELOW IS A PLACEHOLDER VALUE TO PREVENT ERRORS

---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: jenkins-google-chat-secret
  namespace: secrets
spec:
  encryptedData:
    JENKINS_GOOGLE_CHAT_SECRET: 
  template:
    metadata:
      name: jenkins-google-chat-secret
      namespace: secrets
      annotations:
        reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
        reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "jenkins"
        reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
    type: Opaque
