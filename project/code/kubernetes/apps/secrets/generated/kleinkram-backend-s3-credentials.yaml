---
# SeaweedFS S3 identity for kleinkram's backend. Also read directly
# from this namespace by apps/seaweedfs/secrets/seaweedfs-s3-config-job.yaml
# to compose the seaweedfs-s3-config identities JSON
apiVersion: v1
kind: Secret
metadata:
  name: kleinkram-backend-s3-credentials
  namespace: secrets
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY
    secret-generator.v1.mittwald.de/encoding: base64
    secret-generator.v1.mittwald.de/length: "32"
    # TODO: uncomment and set correctly once kleinkram is deployed
    # reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    # reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "kube-kleinkram"
type: Opaque
