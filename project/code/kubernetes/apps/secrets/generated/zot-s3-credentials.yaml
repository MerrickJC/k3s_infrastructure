---
# SeaweedFS S3 identity for Zot's registry storage. Also reflected into
# seaweedfs so apps/seaweedfs/secrets/seaweedfs-s3-config-job.yaml can read
# it from its own namespace to compose the seaweedfs-s3-config identities JSON
apiVersion: v1
kind: Secret
metadata:
  name: zot-s3-credentials
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY
    secret-generator.v1.mittwald.de/encoding: base32
    secret-generator.v1.mittwald.de/length: "32"
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "zot,seaweedfs"
    reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
type: Opaque
