---
# Password for the "kleinkram" PostgreSQL role (apps/postgresql/kleinkram-database.yaml).
# Reflected into the postgresql namespace for Postgres to read, and into the
# kleinkram namespace so it can be passed into the Helm chart for authentication
#
# type: kubernetes.io/basic-auth with `username` matching the role name is
# a CNPG requirement for DatabaseRole passwordSecret.
# encoding: hex (not base64) so the raw password is safe to interpolate
# unescaped into a postgres:// connection string (no '/', '+', '=').
apiVersion: v1
kind: Secret
metadata:
  name: kleinkram-postgres-credentials
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: password
    secret-generator.v1.mittwald.de/encoding: hex
    secret-generator.v1.mittwald.de/length: "32"
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "postgresql,kleinkram"
    reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
type: kubernetes.io/basic-auth
stringData:
  username: kleinkram
