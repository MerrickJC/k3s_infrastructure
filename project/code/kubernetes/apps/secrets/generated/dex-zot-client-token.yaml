---
# Shared OIDC client secret between Dex and Zot. Dex consumes it directly.
# Reflected into `zot` as well so apps/zot/secrets/zot-oidc-credentials-job.yaml
# can read it from its own namespace and repackage it into the format Zot
# requires (zot-oidc-credentials, see apps/zot/secrets/README.md)
apiVersion: v1
kind: Secret
metadata:
  name: zot-dex-client-secret
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: ZOT_DEX_CLIENT_SECRET
    secret-generator.v1.mittwald.de/encoding: base32
    secret-generator.v1.mittwald.de/length: "32"
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "dex,zot"
    reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
type: Opaque
