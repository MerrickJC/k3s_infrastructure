---
# Shared OIDC client secret between Dex and Zot. This is only directly used
# by Dex, as Zot requires a different format. There is a Job which generates
# the Secret Zot needs based on the secret generated here (zot-oidc-credentials,
# see apps/zot/secrets/README.md)
apiVersion: v1
kind: Secret
metadata:
  name: zot-dex-client-secret
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: ZOT_DEX_CLIENT_SECRET
    secret-generator.v1.mittwald.de/encoding: base64
    secret-generator.v1.mittwald.de/length: "32"
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "dex"
    reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
type: Opaque
