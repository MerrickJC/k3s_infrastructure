---
# Shared client secret between Dex and ArgoCD's OIDC config
apiVersion: v1
kind: Secret
metadata:
  name: argocd-dex-client-secret
  namespace: secrets
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: ARGOCD_DEX_CLIENT_SECRET
    secret-generator.v1.mittwald.de/encoding: base64
    secret-generator.v1.mittwald.de/length: "32"
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "dex,argocd"
    reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
  labels:
    app.kubernetes.io/part-of: argocd
type: Opaque
