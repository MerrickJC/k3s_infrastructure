---
# Shared client secret between Dex and ArgoCD's OIDC config
#
# NOTE: This secret is CREATED in the ArgoCD namespace and is REFLECTED
# into other namespaces. This does not follow the same pattern as other
# secrets, because ArgoCD requires a label and the secrets-reflector
# does not support reflecting labels, so this is a work-around

apiVersion: v1
kind: Secret
metadata:
  name: argocd-dex-client-secret
  namespace: argocd
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: ARGOCD_DEX_CLIENT_SECRET
    secret-generator.v1.mittwald.de/encoding: base32
    secret-generator.v1.mittwald.de/length: "32"
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "dex,secrets"
    reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
  labels:
    app.kubernetes.io/part-of: argocd
type: Opaque
