---
# Shared client secret between Dex and Grafana's OIDC config
apiVersion: v1
kind: Secret
metadata:
  name: grafana-dex-client-secret
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: GRAFANA_DEX_CLIENT_SECRET
    secret-generator.v1.mittwald.de/encoding: base64
    secret-generator.v1.mittwald.de/length: "32"
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "dex,observability"
    reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
type: Opaque
