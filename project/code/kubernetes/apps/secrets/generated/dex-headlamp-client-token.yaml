---
# Shared client secret between Dex and Headlamp's OIDC config
apiVersion: v1
kind: Secret
metadata:
  name: headlamp-dex-client-secret
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: HEADLAMP_DEX_CLIENT_SECRET
    secret-generator.v1.mittwald.de/encoding: base64
    secret-generator.v1.mittwald.de/length: "32"
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "dex,headlamp"
    reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
type: Opaque
