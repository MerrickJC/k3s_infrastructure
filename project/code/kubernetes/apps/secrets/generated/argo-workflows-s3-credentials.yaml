---
# SeaweedFS S3 identity for Argo Workflows' artifact repository. Also read
# directly from this namespace by apps/seaweedfs/secrets/seaweedfs-s3-config-job.yaml
# to compose the seaweedfs-s3-config identities JSON
apiVersion: v1
kind: Secret
metadata:
  name: argo-workflows-s3-credentials
  namespace: secrets
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY
    secret-generator.v1.mittwald.de/encoding: base64
    secret-generator.v1.mittwald.de/length: "32"
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "argo"
    reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
type: Opaque
