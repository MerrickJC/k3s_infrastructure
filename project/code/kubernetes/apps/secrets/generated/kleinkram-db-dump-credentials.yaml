---
# Password for the "kleinkram_dbdump" PostgreSQL role
# (apps/postgresql/kleinkram-database.yaml), used by kube-kleinkram's
# db-dump CronJob (apps/kube-kleinkram/values.yaml's secretNames.dbDump) to
# authenticate read-only instead of the api-server's full-access role.
#
# NOTE: This secret is CREATED in the postgresql namespace and is REFLECTED
# into other namespaces (secrets, kleinkram). This does not follow the same
# pattern as most other secrets, because CNPG needs the cnpg.io/reload
# label to hot-reload role passwords, and the secrets-reflector does
# not reflect annotations, so this is a work-around
#
# type: kubernetes.io/basic-auth with `username` matching the role name is
# a CNPG requirement for DatabaseRole passwordSecret.
# encoding: hex (not base64) so the raw password is safe to interpolate
# unescaped into a postgres:// connection string (no '/', '+', '=').
apiVersion: v1
kind: Secret
metadata:
  name: kleinkram-db-dump-credentials
  namespace: postgresql
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: password
    secret-generator.v1.mittwald.de/encoding: hex
    secret-generator.v1.mittwald.de/length: "32"
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "secrets,kleinkram"
    reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
  labels:
    cnpg.io/reload: "true"
type: kubernetes.io/basic-auth
stringData:
  username: kleinkram_dbdump
