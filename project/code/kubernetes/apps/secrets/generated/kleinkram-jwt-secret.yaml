---
# JWT signing secret for kube-kleinkram's api-server/queue-consumer
apiVersion: v1
kind: Secret
metadata:
  name: kleinkram-jwt-secret
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: JWT_SECRET
    secret-generator.v1.mittwald.de/encoding: base64
    secret-generator.v1.mittwald.de/length: "32"
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "kleinkram"
    reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
type: Opaque
