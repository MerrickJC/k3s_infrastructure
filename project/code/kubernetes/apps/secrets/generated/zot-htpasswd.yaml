---
# Zot registry admin credentials for htpasswd (CLI/API) auth. secret-generator's
# basic-auth type generates all three keys directly: username, cleartext
# password, and the bcrypt-hashed "admin:$2y$..." htpasswd line. Not reflected
# anywhere since apps/zot/secrets/zot-htpasswd-combiner-job.yaml reads this
# directly from the `secrets` namespace via scoped RBAC and merges it with
# zot-puller-htpasswd into zot-htpasswd-combined, which is what Zot actually
# mounts. See apps/zot/secrets/README.md
apiVersion: v1
kind: Secret
metadata:
  name: zot-htpasswd
  annotations:
    secret-generator.v1.mittwald.de/type: basic-auth
    secret-generator.v1.mittwald.de/basic-auth-username: admin
    secret-generator.v1.mittwald.de/length: "32"
type: Opaque
