---
# Zot registry admin credentials for htpasswd (CLI/API) auth. secret-generator's
# basic-auth type generates all three keys directly: username, cleartext
# password, and the bcrypt-hashed "admin:$2y$..." htpasswd line. Reflected into
# `zot` so apps/zot/secrets/zot-htpasswd-combiner-job.yaml can read it from its
# own namespace and merge it with zot-puller-htpasswd into zot-htpasswd-combined,
# which is what Zot actually mounts. See apps/zot/secrets/README.md
apiVersion: v1
kind: Secret
metadata:
  name: zot-htpasswd
  annotations:
    secret-generator.v1.mittwald.de/type: basic-auth
    secret-generator.v1.mittwald.de/basic-auth-username: admin
    secret-generator.v1.mittwald.de/length: "32"
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "zot"
    reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
type: Opaque
