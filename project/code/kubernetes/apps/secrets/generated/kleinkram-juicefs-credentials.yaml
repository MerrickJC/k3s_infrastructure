---
# IAM credential kleinkram's backend uses against the JuiceFS S3 Gateway
# (apps/juicefs-s3-gateway) for its main data/db-dump buckets. Registered as a
# scoped mc admin user by
# apps/juicefs-s3-gateway/secrets/juicefs-gateway-iam-job.yaml, so it is NOT the
# gateway's own MINIO_ROOT_USER/PASSWORD superuser credential.
apiVersion: v1
kind: Secret
metadata:
  name: kleinkram-juicefs-credentials
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY
    secret-generator.v1.mittwald.de/encoding: base32
    secret-generator.v1.mittwald.de/length: "32"
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "kleinkram,juicefs"
    reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
type: Opaque
