---
# Zot registry push credentials for CI (GitHub Actions) htpasswd auth. Replaces
# the bearer.oidc/GitHub-OIDC-token trust that used to authenticate CI pushes,
# which had to be removed from apps/zot/values.yaml's config.json because zot
# (as of v2.1.21) disables all other auth methods, including openid.oidc web
# login, whenever bearer.oidc is also configured
# (https://github.com/project-zot/zot/issues/4033). Revert to OIDC-based CI
# auth once zot ships the fix and then this credential can be removed.
#
# Dedicated identity separate from admin/puller so this credential can be
# rotated/revoked independently and only carries the push (not delete) rights
# granted to it by config.json's accessControl.repositories."**".defaultPolicy.
# Not reflected anywhere since apps/zot/secrets/zot-htpasswd-combiner-job.yaml
# reads this directly from the `secrets` namespace via scoped RBAC and merges
# it into zot-htpasswd-combined, which is what Zot actually mounts. See
# apps/zot/secrets/README.md
apiVersion: v1
kind: Secret
metadata:
  name: zot-pusher-htpasswd
  annotations:
    secret-generator.v1.mittwald.de/type: basic-auth
    secret-generator.v1.mittwald.de/basic-auth-username: pusher
    secret-generator.v1.mittwald.de/length: "32"
type: Opaque
