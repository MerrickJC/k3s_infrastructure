---
# Cookie encryption/signing key for oauth2-proxy's session cookie
#
# oauth2-proxy requires this to decode to exactly 16, 24, or 32 raw bytes, hence the "B" suffix
# on length (raw byte count, not output character count. See apps/secrets/README.md).
apiVersion: v1
kind: Secret
metadata:
  name: oauth2-proxy-cookie-secret
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: cookie-secret
    secret-generator.v1.mittwald.de/encoding: base64url
    secret-generator.v1.mittwald.de/length: "32B"
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "oauth2-proxy"
    reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
type: Opaque
