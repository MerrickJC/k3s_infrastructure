---
# Shared OIDC client secret between Dex and Argo Workflows. Unlike apps/zot,
# Argo Workflows' chart accepts a clientSecret secretKeyRef directly, so no
# translation Job is needed - this Secret is consumed as-is in both namespaces.
apiVersion: v1
kind: Secret
metadata:
  name: argo-workflows-dex-client-secret
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: ARGO_WORKFLOWS_DEX_CLIENT_SECRET
    secret-generator.v1.mittwald.de/encoding: base64
    secret-generator.v1.mittwald.de/length: "32"
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "dex,argo"
    reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
type: Opaque
stringData:
  ARGO_WORKFLOWS_DEX_CLIENT_ID: argo-workflows
