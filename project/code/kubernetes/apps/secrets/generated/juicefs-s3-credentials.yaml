---
# SeaweedFS S3 identity for JuiceFS's object storage. Read by
# apps/seaweedfs/secrets/seaweedfs-s3-config-job.yaml (to compose the
# seaweedfs-s3-config identities JSON) and 
# apps/juicefs/secrets/juicefs-sc-secret-job.yaml (to compose the JuiceFS
# StorageClass secret)
#
# Reflected into juicefs and seaweedfs so both builder CronJobs can read it
# from their own namespace instead of via cross-namespace RBAC
apiVersion: v1
kind: Secret
metadata:
  name: juicefs-s3-credentials
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY
    secret-generator.v1.mittwald.de/encoding: base32
    secret-generator.v1.mittwald.de/length: "32"
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "juicefs,seaweedfs"
    reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
type: Opaque
