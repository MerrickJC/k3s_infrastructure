---
# Builds the seaweedfs-s3-config Secret that allInOne.s3.existingConfigSecret
# uses. Combines generated S3 identity (apps/secrets/generated/*-s3-credentials.yaml)
# into a single JSON document for seaweedfs. See apps/seaweedfs/secrets/README.md
# for why this can't be done with SecretTemplate/reflector/secret-generator.
#
# Runs on a schedule so that secret changes are automatically propogated (although
# with a delay). While it creates a newly structured secret every run, the kubectl
# apply step will only update the cluster's live secret if there is a change. If
# the secret has been updated apps/reloader (Stakater Reloader) will detect the
# change and restart the SeaweedFS pod, (Seaweedfs doesn't automatically reload 
# when Secrets change). See apps/reloader/README.md for details
#
# To add a new S3 identity: add a generated credentials Secret under
# apps/secrets/generated/, add its name to the Role's resourceNames list below,
# and add one line to the IDENTITIES table in the script
apiVersion: v1
kind: ServiceAccount
metadata:
  name: seaweedfs-s3-config-builder
  namespace: seaweedfs
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: seaweedfs-s3-config-builder-read
  namespace: secrets
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    # Add every identity's leaf credentials Secret name here
    resourceNames: ["kleinkram-backend-s3-credentials", "zot-s3-credentials", "argo-workflows-s3-credentials", "juicefs-s3-credentials"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: seaweedfs-s3-config-builder-read
  namespace: secrets
subjects:
  - kind: ServiceAccount
    name: seaweedfs-s3-config-builder
    namespace: seaweedfs
roleRef:
  kind: Role
  name: seaweedfs-s3-config-builder-read
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: seaweedfs-s3-config-builder-write
  namespace: seaweedfs
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["seaweedfs-s3-config"]
    verbs: ["get", "patch"]
  # can't scope 'create' to a resourceName since the resource doesn't exist
  # yet to reference by name
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: seaweedfs-s3-config-builder-write
  namespace: seaweedfs
subjects:
  - kind: ServiceAccount
    name: seaweedfs-s3-config-builder
    namespace: seaweedfs
roleRef:
  kind: Role
  name: seaweedfs-s3-config-builder-write
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: seaweedfs-s3-config-builder
  namespace: seaweedfs
spec:
  # changs to SeaweedFS credentials will be detected within 15 minutes
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 6
      template:
        spec:
          serviceAccountName: seaweedfs-s3-config-builder
          restartPolicy: Never
          containers:
            - name: build-s3-config
              image: bitnami/kubectl:latest
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -euo pipefail

                  # One line per S3 identity: <identity-name> <leaf-secret-name> <actions>
                  # Actions are comma-separated. Use unscoped actions
                  # (Admin,Read,Write,List,Tagging) for access to every bucket, or
                  # bucket-scoped actions (Read:bucket,Write:bucket,List:bucket,...)
                  # to restrict an identity to one bucket - see seaweedfs/secrets/README.md
                  # for the caveat about bucket-scoped actions on some SeaweedFS versions.
                  IDENTITIES="
                  kleinkram-backend kleinkram-backend-s3-credentials Admin,Read,Write,List,Tagging
                  zot zot-s3-credentials Read:zot-registry,Write:zot-registry,List:zot-registry,Tagging:zot-registry,Admin:zot-registry
                  argo-workflows argo-workflows-s3-credentials Read:argo-workflows,Write:argo-workflows,List:argo-workflows,Tagging:argo-workflows,Admin:argo-workflows
                  juicefs juicefs-s3-credentials Read:juicefs,Write:juicefs,List:juicefs,Tagging:juicefs,Admin:juicefs
                  "

                  # Builds one identity's JSON object from its leaf Secret.
                  # Safe to interpolate the decoded key material directly: it's
                  # base64 output (secret-generator's `encoding: base64`), whose
                  # charset never contains a '"' or '\', so it can't break the
                  # surrounding JSON string.
                  build_identity() {
                    name="$1"; secret="$2"; actions_csv="$3"
                    access="$(kubectl get secret "$secret" -n secrets -o jsonpath='{.data.AWS_ACCESS_KEY_ID}' | base64 -d)"
                    secret_key="$(kubectl get secret "$secret" -n secrets -o jsonpath='{.data.AWS_SECRET_ACCESS_KEY}' | base64 -d)"
                    actions_json="[$(printf '"%s",' $(echo "$actions_csv" | tr ',' ' '))"
                    actions_json="${actions_json%,}]"
                    printf '{"name":"%s","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":%s}' \
                      "$name" "$access" "$secret_key" "$actions_json"
                  }

                  identities_json=""
                  while read -r name secret actions; do
                    [ -z "$name" ] && continue
                    identity="$(build_identity "$name" "$secret" "$actions")"
                    identities_json="${identities_json:+$identities_json,}$identity"
                  done <<EOF
                  $IDENTITIES
                  EOF

                  json="{\"identities\":[${identities_json}]}"

                  kubectl create secret generic seaweedfs-s3-config -n seaweedfs \
                    --from-literal=seaweedfs_s3_config="${json}" \
                    --dry-run=client -o yaml | kubectl apply -f -
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                runAsNonRoot: true
