# individual components turned off in favour of allInOne mode
master:
  enabled: false
volume:
  enabled: false
filer:
  enabled: false
s3:
  enabled: false

allInOne:
  enabled: true

  # Restarts the pod whenever seaweedfs-s3-config's content changes
  annotations:
    secret.reloader.stakater.com/reload: seaweedfs-s3-config

  s3:
    enabled: true
    port: 9000
    enableAuth: true

    # SealedSecret see secrets/README.md
    existingConfigSecret: seaweedfs-s3-config

    createBuckets:
      - name: zot-registry   # backs the Zot container registry's S3 storage driver
      - name: argo-workflows # backs Argo Workflows' artifact repository
      - name: juicefs        # backs JuiceFS's object storage

  # local-path-retain (defined alongside this file) instead of the cluster's
  # default 'local-path' StorageClass, whose reclaimPolicy: Delete permanently
  # destroys this volume's data if the PVC is ever deleted and recreated.
  data:
    type: persistentVolumeClaim
    storageClass: local-path-retain
    size: 200Gi
