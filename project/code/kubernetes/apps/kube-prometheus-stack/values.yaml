prometheus:
  prometheusSpec:
    # Required so Tempo can push span-metrics/service-graph metrics into
    # Prometheus
    enableRemoteWriteReceiver: true
    enableFeatures:
      - exemplar-storage
      - native-histograms

    # Allow ServiceMonitor/PodMonitor objects from ANY namespace to be
    # picked up with no extra labels required
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

    storageSpec:
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              storage: 50Gi

# By default kube-state-metrics only exposes well-known labels on
# kube_pod_labels (app.kubernetes.io/*, etc). Allowlist Argo Workflows' own
# pod labels so a dashboard can join kube_pod_info (which carries the node
# name) against kube_pod_labels to show which node each Workflow pod landed
# on - see apps/kube-kleinkram's dashboard "Argo Workflow Pod Placement by
# Node" panel.
kube-state-metrics:
  extraArgs:
    - --metric-labels-allowlist=pods=[workflows.argoproj.io/workflow,workflows.argoproj.io/completed]

# node-exporter is a DaemonSet and needs to keep running on the
# kleinkram-actions node pool once it's tainted
prometheus-node-exporter:
  tolerations:
    - key: merrickcampbell.au/node-role
      operator: Equal
      value: kleinkram-actions
      effect: NoSchedule

grafana:
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password

  # Exposed via apps/ingress/routes/grafana.yaml
  ingress:
    enabled: false

  # SSO via Dex. client_secret is deliberately omitted here since Grafana maps
  # ini keys to GF_<SECTION>_<KEY> env vars, so envValueFrom below injects
  # GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET instead of putting the secret in
  # plaintext in this values file. Login form stays enabled so the admin
  # credentials remain a break-glass login
  grafana.ini:
    server:
      domain: grafana.merrickcampbell.au
      root_url: https://grafana.merrickcampbell.au
    auth.generic_oauth:
      enabled: true
      name: Dex
      client_id: grafana
      scopes: openid profile email groups
      auth_url: https://dex.merrickcampbell.au/auth
      token_url: https://dex.merrickcampbell.au/token
      api_url: https://dex.merrickcampbell.au/userinfo
      login_attribute_path: email
      name_attribute_path: name
      email_attribute_path: email
      groups_attribute_path: groups
      role_attribute_path: "contains(groups[*], 'monashmotorsport:autonomous-systems') && 'Admin' || 'Viewer'"
      allow_sign_up: true

  envValueFrom:
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
      secretKeyRef:
        name: grafana-dex-client-secret
        key: GRAFANA_DEX_CLIENT_SECRET

  # Restarts Grafana when the Dex client secret above changes
  annotations:
    reloader.stakater.com/auto: "true"

  # Without this, the chart auto-provisions its own "Prometheus" datasource
  # (uid: prometheus) which is also marked isDefault and collides with the
  # one below which makes Grafana refuse to start ("Only one datasource per
  # organization can be marked as default")
  sidecar:
    datasources:
      defaultDatasourceEnabled: false

  additionalDataSources:
    - name: Prometheus
      type: prometheus
      access: proxy
      url: http://kube-prometheus-stack-prometheus.observability.svc:9090
      uid: prometheus
      isDefault: true

    - name: Tempo
      type: tempo
      access: proxy
      url: http://tempo:3200
      uid: tempo
      jsonData:
        httpMethod: GET
        serviceMap:
          datasourceUid: prometheus
        tracesToLogs:
          datasourceUid: loki
          spanEndTimeShift: '30m'
          spanStartTimeShift: '-30m'
          filterByTraceID: true
          filterBySpanID: true
          tags: ['job']

    - name: Loki
      type: loki
      access: proxy
      url: http://loki:3100
      uid: loki
      jsonData:
        maxLines: 1000
        derivedFields:
          - datasourceUid: tempo
            matcherRegex: 'trace_id\":\"(\w+)\"'
            name: traceId
            url: '$${__value.raw}'
