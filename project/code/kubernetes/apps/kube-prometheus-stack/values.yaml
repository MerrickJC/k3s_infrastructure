prometheus:
  prometheusSpec:
    # Required so Tempo can push span-metrics/service-graph metrics into
    # Prometheus
    enableRemoteWriteReceiver: true
    enableFeatures:
      - exemplar-storage
      - native-histograms

    # Allow ServiceMonitor/PodMonitor objects from ANY namespace to be
    # picked up with no extra labels required
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

    storageSpec:
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              storage: 50Gi

grafana:
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password

  # Exposed via apps/ingress/routes/grafana.yaml
  ingress:
    enabled: false

  # Without this, the chart auto-provisions its own "Prometheus" datasource
  # (uid: prometheus) which is also marked isDefault and collides with the
  # one below which makes Grafana refuse to start ("Only one datasource per
  # organization can be marked as default")
  sidecar:
    datasources:
      defaultDatasourceEnabled: false

  additionalDataSources:
    - name: Prometheus
      type: prometheus
      access: proxy
      url: http://kube-prometheus-stack-prometheus.observability.svc:9090
      uid: prometheus
      isDefault: true

    - name: Tempo
      type: tempo
      access: proxy
      url: http://tempo:3200
      uid: tempo
      jsonData:
        httpMethod: GET
        serviceMap:
          datasourceUid: prometheus
        tracesToLogs:
          datasourceUid: loki
          spanEndTimeShift: '30m'
          spanStartTimeShift: '-30m'
          filterByTraceID: true
          filterBySpanID: true
          tags: ['job']

    - name: Loki
      type: loki
      access: proxy
      url: http://loki:3100
      uid: loki
      jsonData:
        maxLines: 1000
        derivedFields:
          - datasourceUid: tempo
            matcherRegex: 'trace_id\":\"(\w+)\"'
            name: traceId
            url: '$${__value.raw}'
