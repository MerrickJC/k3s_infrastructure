env:
  - name: HEADLAMP_CONFIG_OIDC_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: headlamp-dex-client-secret
        key: HEADLAMP_DEX_CLIENT_SECRET

config:
  oidc:
    clientID: headlamp
    issuerURL: https://dex.merrickcampbell.au
    scopes: "email,groups,audience:server:client_id:kubernetes"
