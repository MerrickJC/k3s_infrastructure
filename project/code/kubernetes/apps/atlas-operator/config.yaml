appName: atlas-operator
namespace: atlas-operator

hasHelm: true
hasManifests: false

helm:
  repoURL: ghcr.io/ariga/charts
  chart: atlas-operator
  targetRevision: 0.7.43

# The chart's CRDs exceed the client-side "last-applied-configuration"
# annotation size limit, so this Application syncs via server-side apply
syncOptions:
  - ServerSideApply=true
