# THIS FILE SHOULD BE NAMED 'config.yaml'
#
# Fill in the details as required
# If you see a command similar to:
#   helm repo add juicefs https://juicedata.github.io/charts/
#                                         ^
#                                       repoUrl
#
# If you see a command similar to:
#   helm upgrade --install juicefs-csi-driver juicefs/juicefs-csi-driver -n kube-system -f ./values-mycluster.yaml
#                                                    |        ^         |
#                                                           chart
#
# Easiest way to find the version is to install the helm cli locally, add the repo, then run:
#   helm search repo <repo>/<chart>
# Which will return the current chart version

appName: <name>
namespace: <namespace-name>

hasHelm: true
hasManifests: true

helm:
  # Classic (index.yaml-based) chart repo:
  #   repoURL: https://<url>
  # OCI registry chart: use the bare registry host/path, with NO scheme
  # prefix (not "https://", and NOT "oci://" either) e.g:
  #   repoURL: registry-1.docker.io/bitnamicharts
  #   repoURL: ghcr.io/<org>/<charts-path>
  # ArgoCD detects the source as a Helm chart (OCI or classic) purely from
  # this repoURL + chart + targetRevision combination, so no extra flag is
  # needed. If the OCI registry is private, register its credentials once
  # as an ArgoCD Repository sealed secret (type: helm, enableOCI: "true")
  # WARNING: Do not set both 'helm' and 'helmGit' on the same app.

  repoURL: https://<url>
  chart: <chart-name>
  targetRevision: <version-number>        # should be the chart version

helmGit:
# Alternative to the 'helm' block above: use this when the chart itself
# lives in a git repo instead of a chart repo/OCI registry index
# entry (e.g. a chart committed alongside an app's own source code).
# repoURL can be a private repo, in which case it must first be
# registered with ArgoCD as a Repository credential (see
# argocd-management/repo-sealed-secret.yaml for the pattern).
# WARNING: Do not set both 'helm' and 'helmGit' on the same app.

  repoURL: git@github.com:<org>/<repo>.git
  path: <path-to-chart-dir-in-that-repo>
  targetRevision: <branch-tag-or-commit>

# Optional: extra entries for this Application's spec.syncPolicy.syncOptions
# (uses ArgoCD's own "Key=Value" strings: https://argo-cd.readthedocs.io/en/stable/user-guide/sync-options/).
# CreateNamespace=true is always included automatically and should not be added
# here omit this whole key if you don't need anything beyond that.
# Common use: ServerSideApply=true for charts whose CRDs are too large for
# client-side apply's annotation size limit (see atlas-operator/config.yaml).
# Do not use this if you do not need it
# syncOptions:
#   - ServerSideApply=true

# All of the following are optional. Omit any key you don't need - each is
# only forwarded onto the generated Application when the key is present.

# Passed through verbatim to spec.ignoreDifferences - use for resources an
# operator mutates in place (e.g. injected webhook CA bundles).
# ignoreDifferences:
#   - group: admissionregistration.k8s.io
#     kind: MutatingWebhookConfiguration
#     jsonPointers:
#       - /webhooks/0/clientConfig/caBundle

# Extra labels/annotations merged onto the generated Application's own
# metadata (not onto the app's deployed resources).
# labels:
#   team: platform
# annotations:
#   example.com/owner: platform-team

# Passed through verbatim to spec.syncPolicy.retry.
# retry:
#   limit: 5
#   backoff:
#     duration: 5s
#     factor: 2
#     maxDuration: 3m

# If true, deleting this app's config.yaml deletes the ArgoCD Application
# but leaves its live cluster resources in place instead of pruning them.
# Set this for apps backed by durable state (see apps/postgresql/config.yaml).
# preventDeletion: true