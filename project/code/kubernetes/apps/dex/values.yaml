envFrom:
  - secretRef:
      name: dex-github-oauth
  - secretRef:
      name: headlamp-dex-client-secret
  - secretRef:
      name: argocd-dex-client-secret
  - secretRef:
      name: jenkins-dex-client-secret
  - secretRef:
      name: zot-dex-client-secret
  - secretRef:
      name: argo-workflows-dex-client-secret
  - secretRef:
      name: grafana-dex-client-secret
  - secretRef:
      name: kleinkram-dex-client-secret

# oauth2-proxy-dex-client-secret can't go through envFrom above: its key is lower-hyphenated
# (client-secret) to double as oauth2-proxy's config.existingSecret, and envFrom requires every
# key to already be a valid env var name. envVars lets us point an arbitrary env var name at an
# arbitrary secret key instead.
envVars:
  - name: OAUTH2_PROXY_DEX_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: oauth2-proxy-dex-client-secret
        key: client-secret

# Restarts the pod when any of the envFrom/envVars secrets above change
deploymentAnnotations:
  reloader.stakater.com/auto: "true"

config:
  issuer: https://dex.merrickcampbell.au
  storage:
    type: kubernetes
    config:
      inCluster: true
  web:
    http: 0.0.0.0:5556

  oauth2:
    skipApprovalScreen: true

  staticClients:
    - id: headlamp
      redirectURIs:
        - 'http://headlamp.merrickcampbell.au/oidc-callback'
        - 'https://headlamp.merrickcampbell.au/oidc-callback'
      name: 'Headlamp Web'
      secretEnv: HEADLAMP_DEX_CLIENT_SECRET
    - id: kubernetes
      name: 'Kubernetes CLI'
      public: true
      redirectURIs:
        - 'http://localhost:8000'
        - 'urn:ietf:wg:oauth:2.0:oob'
      trustedPeers:
        - headlamp
    - id: argocd
      redirectURIs:
        - 'https://argocd.merrickcampbell.au/auth/callback'
      name: 'ArgoCD'
      secretEnv: ARGOCD_DEX_CLIENT_SECRET
    - id: jenkins
      redirectURIs:
        - 'https://jenkins.merrickcampbell.au/securityRealm/finishLogin'
      name: 'Jenkins'
      secretEnv: JENKINS_DEX_CLIENT_SECRET
    - id: zot
      redirectURIs:
        - 'https://registry.direct.merrickcampbell.au/zot/auth/callback/oidc'
      name: 'Zot Registry'
      secretEnv: ZOT_DEX_CLIENT_SECRET
    - id: argo-workflows
      redirectURIs:
        - 'https://workflows.merrickcampbell.au/oauth2/callback'
      name: 'Argo Workflows'
      secretEnv: ARGO_WORKFLOWS_DEX_CLIENT_SECRET
    - id: grafana
      redirectURIs:
        - 'https://grafana.merrickcampbell.au/login/generic_oauth'
      name: 'Grafana'
      secretEnv: GRAFANA_DEX_CLIENT_SECRET
    - id: kleinkram
      redirectURIs:
        - 'https://kleinkram-api.merrickcampbell.au/auth/oidc/callback'
      name: 'Kleinkram'
      secretEnv: KLEINKRAM_DEX_CLIENT_SECRET
    # Single shared client for every app fronted by apps/oauth2-proxy. Add a new app's own
    # `https://<host>/oauth2/callback` to redirectURIs below when protecting it. See
    # apps/oauth2-proxy/README.md for details
    - id: oauth2-proxy
      redirectURIs:
        - 'https://kueueviz.merrickcampbell.au/oauth2/callback'
      name: 'oauth2-proxy (SSO gateway)'
      secretEnv: OAUTH2_PROXY_DEX_CLIENT_SECRET

  connectors:
  - type: github
    id: github
    name: GitHub
    config:
      clientID: $GITHUB_CLIENT_ID
      clientSecret: $GITHUB_CLIENT_SECRET
      redirectURI: https://dex.merrickcampbell.au/callback

      # List of org and team names.
      #  - If specified, a user MUST be a member of at least ONE of these orgs
      #    and teams (if set) to authenticate with dex.
      #  - Dex queries the following organizations for group information if the
      #    "groups" scope is requested. Group claims are formatted as "(org):(team)".
      #    For example if a user is part of the "engineering" team of the "coreos" org,
      #    the group claim would include "coreos:engineering".
      #  - If teams are specified, dex only returns group claims for those teams.
      orgs:
      - name: monashmotorsport

      # Flag which indicates that all the user's orgs and teams should be loaded.
      # Only works if neither 'org' nor 'orgs' are specified in the config.
      loadAllGroups: false

      # How the team names are formatted.
      #  - Options: 'name' (default), 'slug', 'both'.
      #  - Examples:
      #    - 'name': 'acme:Site Reliability Engineers'
      #    - 'slug': 'acme:site-reliability-engineers'
      #    - 'both': 'acme:Site Reliability Engineers', 'acme:site-reliability-engineers'
      teamNameField: slug

      # Flag which will switch from using the internal GitHub id to the users handle (@mention) as the user id.
      # It is possible for a user to change their own username, but it is very rare for them to do so
      useLoginAsID: false

      # A preferred email domain to use when returning the user's email.
      #  - If the user has a PUBLIC email, it is ALWAYS returned in the email claim,
      #    so this field would have NO effect (this may change in the future).
      #  - By default, if the user does NOT have a public email, their primary email is returned.
      #  - When 'preferredEmailDomain' is set, the first email matching this domain is returned,
      #    we fall back to the primary email if no match is found.
      #  - To allow multiple subdomains, you may specify a wildcard like "*.example.com"
      #    which will match "aaaa.example.com" and "bbbb.example.com", but NOT "example.com".
      #  - To return the user's no-reply email, set this field to "users.noreply.github.com",
      #    this is a mostly static email that GitHub assigns to the user. These emails
      #    are formatted like 'ID+USERNAME@users.noreply.github.com' for newer accounts
      #    and 'USERNAME@users.noreply.github.com' for older accounts.
      preferredEmailDomain: "monashmotorsport.com"
