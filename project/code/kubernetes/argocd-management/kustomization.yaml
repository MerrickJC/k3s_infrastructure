apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  # Declaratively reference the remote raw manifest URL
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.0/manifests/install.yaml
  - ./argocd-manifest.yaml
  - ./helm-automation.yaml
  - ./manifest-automation.yaml

# (Optional) You can add patches here later to configure Argo CD 
# e.g., ingress, custom argocd-cm settings, resource limits, etc.